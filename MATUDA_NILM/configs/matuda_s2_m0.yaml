# MATUDA M0 — Entropy-Gated Conditional DA (EGC-DA) on FC layers
# Novelty: CDAN+E-style entropy weights + appliance-conditional CORAL/MMD
experiment_id: matuda_s2_m0_egc
seed: 2026

data_root: D:/Raymond/high_low_freq_NILM/multi_appliances_NILM/datasets/ukdale
output_dir: D:/Raymond/high_low_freq_NILM/MATUDA_NILM/results/matuda_s2_m0_egc

prediction_mode: seq2point
seq_len: 599
stride_train: 30
stride_eval: 60
batch_size: 64
num_workers: 0
target_adapt_frac: 0.7

appliances: [kettle, fridge, dishwasher, washingmachine, microwave]

conv_channels: 96
tcn_blocks: 8
fc_dims: [512, 256, 128]
dropout: 0.15
use_gate: true

lr: 0.001
weight_decay: 0.0001
epochs: 80
steps_per_epoch: 600
power_weight: 2.0
state_weight: 1.0

domain_adaptation:
  enabled: true
  mode: egc
  lambda_domain: 0.6
  mu_mmd: 0.4
  domain_mix: convex
  domain_scale: equal
  conditional_weight: 0.5
  warmup_epochs: 10
