# MATUDA B0 — source-only seq2point (λ=0), UK-DALE H1+H5 → H2 eval
experiment_id: matuda_s2_b0_source_only
seed: 2026

data_root: D:/Raymond/high_low_freq_NILM/multi_appliances_NILM/datasets/ukdale
output_dir: D:/Raymond/high_low_freq_NILM/MATUDA_NILM/results/matuda_s2_b0_source_only

# Prediction: sequence-to-point (Zhang 2018 / Li 2022): T=599 odd, label = center.
prediction_mode: seq2point
seq_len: 599
stride_train: 30
stride_eval: 60
batch_size: 64
num_workers: 0
# First 70% of House-2 timeline = unlabeled adapt; last 30% = held-out test.
target_adapt_frac: 0.7

appliances: [kettle, fridge, dishwasher, washingmachine, microwave]

# Capacity upgrade vs S1
conv_channels: 96
tcn_blocks: 8
fc_dims: [512, 256, 128]
dropout: 0.15
use_gate: true

lr: 0.001
weight_decay: 0.0001
epochs: 80
steps_per_epoch: 600
power_weight: 2.0
state_weight: 1.0

domain_adaptation:
  enabled: false
  mode: none
  lambda_domain: 0.0
  mu_mmd: 0.4
  domain_mix: convex
  domain_scale: equal
  warmup_epochs: 0
