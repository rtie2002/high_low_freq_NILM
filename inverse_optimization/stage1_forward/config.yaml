# Sliding Windows

data:
  window_length: 512
  stride: 256
  # Append day_sin, day_cos, week_sin, and week_cos to the five appliance inputs.
  use_calendar_features: false
  # Apply background cleaning only to training data.
  # Validation and testing remain raw to represent deployment data.
  clean_background: false
  background_std_multiplier: 2.0

# Stage-1 forward model:
# five appliance powers plus known calendar features -> LSTM -> aggregate power.
model:
  name: lstm

training:
  # Change this name for each experiment. It becomes part of the result folder.
  experiment_name: forward_lstm_background_normal_windows
  seed: 2026
  batch_size: 16
  epochs: 100
  learning_rate: 0.001

