# Sliding Windows

data:
  # Existing cross-house dataset or the separate within-house temporal split.
  dataset_name: mixed_ukdale_refit_5w_temporal_602020
  window_length: 256
  stride: 128
  # Append day_sin, day_cos, week_sin, and week_cos to the five appliance inputs.
  use_calendar_features: true
  # Append five ground-truth appliance ON/OFF labels to the Stage-1 input.
  # This experiment cannot be used for real Stage-2 inverse optimisation.
  use_state_features: true
  # Apply background cleaning only to training data.
  # Validation and testing remain raw to represent deployment data.
  clean_background: true
  background_std_multiplier: 2.0

# Stage-1 forward model:
# Five appliance powers, four calendar values, and five ON/OFF states -> aggregate.
model:
  name: resnet
  # 5 powers + 4 calendar values + 5 appliance ON/OFF states.
  input_size: 14

training:
  # Change this name for each experiment. It becomes part of the result folder.
  experiment_name: forward_resnet_256_time_state_features
  seed: 2026
  batch_size: 16
  epochs: 100
  learning_rate: 0.001

