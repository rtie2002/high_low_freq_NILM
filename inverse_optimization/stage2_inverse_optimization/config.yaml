inverse:
  # Name used for results/<experiment_name>_<timestamp>/.
  experiment_name: neural_adjoint_baseline

  # Stage-1 checkpoint to invert. This path is relative to this config file.
  # Replace REPLACE_WITH_FORWARD_RUN with the chosen Stage-1 result folder.
  checkpoint_path: "../results/forward_lstm_baseline_20261117_225146_155830/best.pt"

  # Use validation while developing Stage 2. Test remains report-only.
  split: validating
  window_index: 0
  # Process every validation window from window_index onward. This includes
  # the many all-OFF windows and rare appliance-ON windows; do not discard
  # sparse events by evaluating only a small sample.
  # Set an integer here only for a shorter diagnostic run.
  num_windows: null

  # Neural-Adjoint search settings.
  seed: 2026
  restarts: 32
  # Number of independent meter windows optimized together on the GPU.
  batch_windows: 16
  steps: 500 #Epochs
  learning_rate: 0.01

  # Weight of the training-domain boundary loss.
  boundary_weight: 1.0

  # Predicted power (W) at or above these values is classified as ON.
  # Order: kettle, fridge, dishwasher, washingmachine, microwave.
  on_thresholds: [200, 50, 50, 20, 200]

  # ON-event plotting: show each selected ON event with OFF context before and
  # after it, following the MART-NILM waveform-selection idea.
  scenario_margin_samples: 40
  scenario_min_on_samples: 2

  # Console progress interval in optimisation steps.
  print_every: 50
