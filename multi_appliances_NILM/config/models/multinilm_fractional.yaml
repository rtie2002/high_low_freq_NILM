# MultiNILM + fractional front-end (baseline MultiNILM.py unchanged).
# Dataloader stays 1D; model expands to C=9 (raw + 8 α).
model_name: multinilm_fractional

data:
  mains_column: aggregate
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  # After overlap_mean stitch: zero watts where pred ON is false (align plot/metrics with hard gate)
  regate_power_with_pred_on: true

windowing:
  input_window_length: 2048
  output_window_length: 2048
  output_alignment: end
  input_stride: 1024
  eval_stride: 1024
  eval_reconstruction: auto
  training_targets: auto

fractional:
  enabled: true
  k: 8
  include_raw: true
  memory: 1024
  channel_normalize: mean_std

architecture:
  # --- width (channels, not kernels) ---
  input_channels: 9                 # fractional: raw + 8 α
  channel_schedule: [32, 64, 128]   # stem out → mid → before TCN
  hidden_channels: 128              # TCN + heads stay at 128

  # --- 1) STEM: local waveform shape (first look at aggregate) ---
  # Multiscale ON: three parallel kernels, then fuse. detail_* are the ones that matter.
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]         # short / mid / wide local patterns
  detail_branch_channels: 16        # channels per branch before 1x1 fuse
  stem_kernel_size: 7               # ONLY used if use_multiscale_stem: false

  # --- 2) STAGES: widen 32→64→128 (still local, no dilation) ---
  stage_kernel_size: 5

  # --- 3) TCN: long context on 6 s grid (must use odd kernel_size) ---
  num_blocks: 5                     # residual blocks; dilations 1,2,4,8,16
  kernel_size: 9                    # odd only (even → length 2048→2047 crash)
  max_dilation: 16                  # cap; tap spacing = dilation × 6 s
  dropout: 0.15

  # --- 4) HEADS: per-appliance power + ON/OFF ---
  head_local_layers: 2
  head_kernel_size: 9               # odd; small local refine before 1x1 heads
  head_use_residual: true
  gate_mode: soft_train_hard_eval   # soft gate in train; hard mask at eval
  gate_threshold: 0.5

  # --- 5) extras ---
  cross_appliance:
    enabled: true
    residual_scale: 0.5             # how strong cross-app mix is
  # DA hooks (unused while domain_adaptation.enabled: false)
  domain_feature_layers: [temporal_2, temporal_4, aligned]

loss:
  task_balance: equal
  lambda_state: 1
  pos_weight: auto
  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  # Warm up task first; then ramp DA
  da_warmup_epochs: 0
  da_ramp_epochs: 0
  da_freeze_patience: 0
  lambda_domain: 0.1

domain_adaptation:
  enabled: false
  target_split: test

training:
  batch_size: 64
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 50
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.00001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    # Every N epochs: keep waveforms under epoch_XXXX/ and val/test MAE/SAE/F1 tables
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    # One-picture dashboards under run_dir/comparisons/
    # Waveform collages: one PNG per ON-period case (01..plot_on_periods)
    comparison_dpi: 600
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
