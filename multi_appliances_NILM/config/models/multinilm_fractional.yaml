# MultiNILM + fractional front-end (baseline MultiNILM.py unchanged).
# Dataloader stays 1D; model expands to C=9 (raw + 8 α).
model_name: multinilm_fractional

data:
  mains_column: aggregate
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  # After overlap_mean stitch: zero watts where pred ON is false (align plot/metrics with hard gate)
  regate_power_with_pred_on: true

windowing:
  input_window_length: 2048
  output_window_length: 2048
  output_alignment: end
  input_stride: 1024
  eval_stride: 1024
  eval_reconstruction: auto
  training_targets: auto

fractional:
  enabled: true
  k: 8
  include_raw: true
  memory: 1024
  channel_normalize: mean_std

architecture:
  input_channels: 9
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 5
  kernel_size: 5
  max_dilation: 16
  dropout: 0.25
  # Hard gate train+eval: power = 1{state>thr}*power_raw + else off_norm
  gate_mode: soft_train_hard_eval
  gate_threshold: 0.5
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  cross_appliance:
    enabled: true
    residual_scale: 0.5
  # num_blocks=5 → valid hooks: temporal_0..temporal_4 (+ stem/aligned)
  domain_feature_layers: [temporal_2, temporal_4, aligned]

loss:
  task_balance: equal
  lambda_state: 1
  pos_weight: auto
  # Emphasize ON timesteps in power MSE (reduces flat/lazy amplitude after ep50)
  on_power_weight: 5.0
  # Light temporal smoothness on predicted power
  lambda_tv: 0.01
  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  # Warm up task first; then ramp DA
  da_warmup_epochs: 0
  da_ramp_epochs: 0
  da_freeze_patience: 0
  lambda_domain: 0.3

domain_adaptation:
  enabled: false
  target_split: test

training:
  batch_size: 64
  # Don't over-train source val F1 while test shape/F1 die
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0005
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 30
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.00001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    # Every N epochs: keep waveforms under epoch_XXXX/ and val/test MAE/SAE/F1 tables
    plot_interval: 30
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    # One-picture dashboards under run_dir/comparisons/
    # Waveform collages: one PNG per ON-period case (01..plot_on_periods)
    comparison_dpi: 600
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
