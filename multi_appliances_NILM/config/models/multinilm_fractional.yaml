# MultiNILM + fractional front-end (baseline MultiNILM.py unchanged).
# Dataloader stays 1D; model expands to C=12
# (raw + abs_delta + rolling mean/std + 4 fractional alpha channels).
#
# Run folder: runs/<experiment_id>/<model_name>/
# Pair with config/experiment_ukdale.yaml or experiment_redd.yaml (data only).
# Change experiment_id when switching dataset / DA / multi-domain mix.
experiment_id: extra_feature_statecal_onloss_long
model_name: multinilm_fractional

# =============================================================================
# DATA / EVAL (labels + how ON is scored)
# =============================================================================
data:
  mains_column: aggregate
  # csv → train/F1/plots all use CSV *_on (Algorithm-1). Never power>thr shade.
  # threshold → ON = power > experiment.evaluation.on_thresholds_watts
  state_label_source: csv           # csv | threshold

evaluation:
  pred_on_source: state_head        # state_head | power_threshold | combined
  # After overlap_mean stitch: zero watts where pred ON is false
  regate_power_with_pred_on: true
  # Learn each appliance ON threshold from validation, then reuse it on test.
  # This fixes the heavy false-ON problem caused by one shared 0.5 threshold.
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    apply_to_power: true
    postprocess:
      enabled: true
      min_on_samples:
        kettle: 5
        fridge: 20
        dishwasher: 160
        washingmachine: 300
        microwave: 10
      merge_gap_samples:
        kettle: 0
        fridge: 40
        dishwasher: 300
        washingmachine: 160
        microwave: 3

# =============================================================================
# WINDOWING (6 s samples; 2048 ≈ 3.4 h)
# =============================================================================
windowing:
  input_window_length: 2048
  output_window_length: 2048
  output_alignment: end
  input_stride: 1024
  eval_stride: 1024
  eval_reconstruction: auto         # overlap_mean if stride < out len
  training_targets: auto            # full_input if in == out

# =============================================================================
# FRACTIONAL / AGGREGATE FEATURE FRONT-END
# =============================================================================
fractional:
  enabled: true
  k: 4                         # number of alpha channels
  include_raw: true             # always keep raw → input_channels = k + 1
  include_delta: false          # alpha=1.0 already approximates first difference
  include_abs_delta: true       # event strength regardless of rise/drop direction
  include_rolling_mean: true    # local aggregate baseline
  include_rolling_std: true     # local fluctuation / stability
  rolling_windows: [10, 30, 60] # 6s data: 1 min, 3 min, 6 min local context
  memory: 32
  channel_normalize: none       # keep aggregate amplitude/baseline information

# =============================================================================
# ARCHITECTURE
# =============================================================================
architecture:
  # --- width (channels, not kernels) ---
  # input_channels is NOT set here — build_multinilm_fractional sets it to
  #   k + 1  (include_raw)  or  k  (include_raw: false)
  channel_schedule: [32, 64, 128]   # stem out → mid → before TCN
  hidden_channels: 128              # TCN + heads stay at 128

  # --- 1) STEM: local waveform shape ---
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]         # short / mid / wide local patterns
  detail_branch_channels: 16        # channels per branch before 1x1 fuse
  stem_kernel_size: 7               # ONLY if use_multiscale_stem: false

  # --- 2) STAGES: widen 32→64→128 (no dilation) ---
  stage_kernel_size: 5

  # --- 3) TCN: long context (kernel_size must be odd) ---
  num_blocks: 4                    # dilations 1,2,4,8,16
  kernel_size: 9                    # even → length crash (2048→2047)
  max_dilation: 16
  dropout: 0.25

  # --- 4) HEADS: per-appliance power + ON/OFF ---
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  gate_mode: soft   # soft in train; hard mask at eval
  gate_threshold: 0.5

  # --- 5) extras ---
  cross_appliance:
    enabled: false
    residual_scale: 0.5
  # DA feature hooks (used only if domain_adaptation.enabled)
  domain_feature_layers: [temporal_1, temporal_3, aligned]

# =============================================================================
# LOSS — task (power + state) then optional domain terms
# =============================================================================
loss:
  # --- task: power regression + ON/OFF classification ---
  task_balance: equal               # equal ≈ match magnitudes; none = raw sum
  lambda_state: 1                   # with equal, 1 = power ↔ state same weight
  pos_weight: auto                  # BCE imbalance; auto from train ON rates
  pos_weight_cap: 30                # cap rare-appliance BCE weight to reduce false ON spam
  power_on_weight: 2.0              # extra MSE on true-ON samples; helps amplitude
  power_delta_weight: 0.25          # match rise/fall shape, not only average level
  power_delta_on_only: true
  power_energy_weight: 0.10         # reduce under-estimated appliance energy

  # --- domain (active only if domain_adaptation.enabled AND lambda_domain > 0) ---
  domain_method: both               # coral | mmd | both
  domain_mu: 0.4                    # L_domain = μ·MMD² + (1-μ)·CORAL
  domain_mix: convex                # convex: (1-λ)L_task + λ L_domain
  domain_scale: equal               # rescale L_domain toward L_task so λ matters
  lambda_domain: 0.0

  # --- DA schedule (0 = off / immediate) ---
  da_warmup_epochs: 0               # train task only for N epochs
  da_ramp_epochs: 0                 # then ramp λ over N epochs
  da_freeze_patience: 0             # freeze DA if no val gain (0 = never)

# =============================================================================
# DOMAIN ADAPTATION (master switch)
# Needs enabled: true AND loss.lambda_domain > 0
# =============================================================================
domain_adaptation:
  enabled: false
  target_split: test                # unlabeled target (e.g. UK-DALE H2 / REDD H2)

# =============================================================================
# TRAINING
# =============================================================================
training:
  # --- loop ---
  batch_size: 64
  epochs: 160
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  train_shuffle: true
  gradient_clip: 1.0

  # --- precision / CUDA ---
  use_amp: false
  amp_dtype: bf16
  cudnn_benchmark: true
  tf32: true

  # --- checkpoint / early stop ---
  # val_loss is too sensitive after ON/shape-aware power loss. Select best.pt
  # with validation MAE + state F1, and never early-stop before min_epochs.
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  checkpoint_mae_weight: 7.0
  early_stop_patience: 45
  early_stop_min_epochs: 80

  # --- LR schedule ---
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 10
    factor: 0.5
    min_lr: 0.00001

  # --- plots (under run_dir/) ---
  plots:
    plot_mode: interval             # interval | every | none
    plot_interval: 50               # every N epochs: waveforms + tables
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10      # ×10 context PNG; <=1 disables
    comparison_dpi: 600             # collage dashboards under comparisons/
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
