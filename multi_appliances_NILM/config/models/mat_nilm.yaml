# MATNILM — 4-appliance architecture (REDD default). Windowing/training tuned for practical runs.
model_name: mat_nilm

windowing:
  input_window_length: 864
  output_window_length: 64
  output_alignment: center
  input_stride: 32
  eval_stride: 64
  training_targets: output_window

architecture:
  input_size: 1
  hidden: 32
  dropout: 0.1

data:
  # Appliance order now comes from the selected experiment yaml.
  # MATconv itself is still fixed to 4 outputs, so the experiment must define 4 appliances.
  mains_column: aggregate
  state_label_source: threshold
  state_threshold_watts: 15.0

training:
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip: 0.0
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  use_amp: true
  amp_dtype: bf16
  tf32: true
  cudnn_benchmark: true
  torch_compile: true
  checkpoint_monitor: val_mae
  early_stop_patience: 15
  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 3
    on_period_samples: 0
    full_cycle_appliances: [washingmachine, dishwasher]
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_figsize: 5.5
    waveform_dynamic_figsize: true
    waveform_dpi: 200
    plot_max_batches: 32
