# MATNILM model config (Zhang et al., BuildSys 2021)
# Architecture: model/MATNILM.py | Loss: model/MATNILM_loss.py

model:
  name: mat_nilm
  task: multi_appliance_joint

windowing:
  input_window_length: 864
  output_window_length: 64
  output_alignment: center
  input_stride: 1              # increase to 4 for ~4x faster MATNILM epochs
  eval_stride: 64
  training_targets: full_input   # train on full input window (author SubSet behaviour)

architecture:
  input_size: 1
  hidden: 32
  dropout: 0.1
  num_appliances: 4

data:
  # Override experiment appliance list — MATNILM is fixed to 4 appliances (REDD order).
  appliances: [dishwasher, fridge, microwave, washingmachine]
  mains_column: aggregate
  power_scale: 612.0            # divide CSV watts by this at train/eval (author /612)
  state_threshold_watts: 15.0   # ON if raw power > 15 W (author SubSet)

training:
  epochs: 200
  batch_size: 192               # RTX 4090 24GB — try 256 with use_amp
  learning_rate: 0.001
  optimizer: Adam
  weight_decay: 0.0
  gradient_clip: 0.0
  num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  use_amp: true
  amp_dtype: bf16
  tf32: true
  cudnn_benchmark: true
  torch_compile: false
  seed: 2026
  checkpoint_monitor: val_mae

  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 5
    on_period_samples: 0
    full_cycle_appliances: [washingmachine, dishwasher]
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_figsize: 5.5
    waveform_dynamic_figsize: true
    waveform_dpi: 200
    plot_max_batches: null

loss:
  power: mse
  state: bce
  combine: power_loss + state_loss
