model_name: multinilm

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  # state_head | power_threshold | combined
  pred_on_source: combined

windowing:
  input_window_length: 864
  output_window_length: &output_len 256
  output_alignment: center
  input_stride: 1
  eval_stride: *output_len
  eval_reconstruction: flat
  training_targets: output_window

architecture:
  input_channels: 1
  hidden_channels: 192
  num_blocks: 6
  kernel_size: 5
  dropout: 0.12

loss:
  lambda_state: 1
  pos_weight: auto

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  use_amp: true
  amp_dtype: bf16
  checkpoint_monitor: val_mae
  early_stop_patience: 15
  scheduler: reduce_on_plateau
  scheduler_monitor: val_mae
  scheduler_patience: 5
  scheduler_factor: 0.5
  scheduler_min_lr: 0.000001
  gradient_clip: 1.0
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
