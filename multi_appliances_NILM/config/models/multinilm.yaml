# MultiNILM UK-DALE — 480/480 full-sequence supervision (val-first setup).
model_name: multinilm

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
 # state_head | power_threshold | combined
  pred_on_source: state_head

windowing:
  input_window_length: 480
  output_window_length: 480
  output_alignment: end
  input_stride: 240
  eval_stride: 240
  eval_reconstruction: auto   # overlap_mean when eval_stride < output length, else flat
  training_targets: auto      # full_input when input == output length, else output_window

architecture:
  input_channels: 1
  # Capacity: wide [32,64,128] + 8 TCN blocks (12 blocks hurt F1; keep this).
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 8
  kernel_size: 5
  max_dilation: 64
  dropout: 0.15
  # soft | hard | soft_train_hard_eval
  # hard: binary 0/1 gate always (STE in train so gradients still flow). soft: smooth σ.
  # soft_train_hard_eval: soft in train, hard in val/test/plots.
  gate_mode: hard
  gate_threshold: 0.5
  # Per-appliance local temporal decoder (redraw short spikes/edges before 1x1 heads).
  # 0 = old 1x1-only refine. 2 x k=3 + residual is the recommended start.
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  # Multi-scale stem only (no shape loss). Replaces first k=7 layer; then [32→64→128].
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16

  # Lin-style multi-layer DA (paper: fc6–fc8 near the head).
  # With num_blocks=8: late TCN hooks + pre-head aligned ≈ paper's three late layers.
  # Options: stem | temporal | aligned | temporal_0 .. temporal_{num_blocks-1}
  domain_feature_layers: [temporal_4, temporal_6, aligned]

loss:
  # equal = auto-match power/state magnitudes so lambda_state=1 means equal weight.
  # none  = old behavior: L = L_power + lambda_state * L_state (must tune lambda).
  task_balance: equal
  lambda_state: 1          # with task_balance=equal, 1 = equal power ↔ state
  pos_weight: auto
  # Domain adaptation (Lin et al. IEEE TSG 2022).
  # coral | mmd | both  — paper Eq.(12) uses both with μ=0.4
  domain_method: both
  domain_mu: 0.4          # paper μ=0.4 → L_domain = μ·MMD² + (1-μ)·CORAL
  # Paper mixes as L=(1-λ)L_R + λ L_domain with best λ=0.6 → domain_mix: convex
  # additive = legacy L=L_NILM + λ L_domain (DA often too weak if L_domain << L_NILM).
  domain_mix: convex
  # none = use raw L_domain (often << L_NILM). equal = rescale to L_NILM so λ is meaningful.
  domain_scale: equal
  lambda_domain: 0.6
  # mmd_sigma: auto       # optional fixed RBF bandwidth; omit/auto = median heuristic

# Lin-style unsupervised DA: source = train (H1+H5), target aggregates only.
# Requires both enabled: true AND loss.lambda_domain > 0.
domain_adaptation:
  enabled: true
  target_split: test      # unlabeled target house (UK-DALE H2); y/z ignored

training:
  batch_size: 32
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 60
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.000001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    feature_maps:
      enabled: true
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
