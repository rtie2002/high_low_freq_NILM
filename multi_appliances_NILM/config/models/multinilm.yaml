# MultiNILM UK-DALE — 480/480 full-sequence supervision (val-first setup).
model_name: multinilm

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
 # state_head | power_threshold | combined
  pred_on_source: state_head

windowing:
  input_window_length: 480
  output_window_length: 480
  output_alignment: end
  input_stride: 240
  eval_stride: 240
  eval_reconstruction: overlap_mean
  training_targets: full_input

architecture:
  input_channels: 1
  channel_schedule: [16, 32, 64]
  hidden_channels: 64
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 6
  kernel_size: 5
  dropout: 0.12
  gate_mode: soft
  gate_threshold: 0.5

loss:
  lambda_state: 1
  pos_weight: auto

training:
  batch_size: 32
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.00001  # 1e-5 L2 via Adam
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 60
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.000001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    feature_maps:
      enabled: true
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
