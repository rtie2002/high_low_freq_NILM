# MATUDA v2 — OFF-norm gate + ON-masked power + EGC-DA (publishable candidate)
model_name: matuda

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  input_window_length: 599
  output_window_length: 1
  output_alignment: center
  input_stride: 30
  eval_stride: 60
  eval_reconstruction: flat
  training_targets: output_window

architecture:
  conv_channels: 96
  tcn_blocks: 8
  fc_dims: [512, 256, 128]
  dropout: 0.15
  use_gate: true
  gate_mode: soft
  stem_kernels: [3, 5, 9]

loss:
  power_weight: 2.0
  state_weight: 1.5
  pos_weight: auto
  pos_weight_cap: 50
  on_masked_power: true
  da_mode: egc
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  conditional_weight: 0.5
  lambda_domain: 0.6

domain_adaptation:
  enabled: true
  mode: egc
  target_split: test

training:
  batch_size: 64
  epochs: 150
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 50
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 10
    factor: 0.5
    min_lr: 0.00001
  gradient_clip: 5.0
  train_shuffle: true
  cudnn_benchmark: true
  plots:
    plot_mode: interval
    plot_interval: 25
    n_waveform_periods: 3
