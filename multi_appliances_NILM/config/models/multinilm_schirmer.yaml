# MultiNILM + Schirmer-inspired prior: fractional 9-ch + sliding KLE → time-varying FiLM.
# Honest hybrid (not full paper 2D-CNN regressor). DA: H1+H5 → unlabeled H2.
model_name: multinilm_schirmer

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  input_window_length: 600
  output_window_length: 600
  output_alignment: end
  input_stride: 300
  eval_stride: 300
  eval_reconstruction: auto
  training_targets: auto

# 1D path: raw + 8 α → C=9; per-channel z-score balances energies
fractional:
  enabled: true
  k: 8
  include_raw: true
  memory: 256
  channel_normalize: mean_std

# Sliding KLE maps A,Φ (paper-style frames) → Conv2d → time-varying FiLM on α only
kle:
  n_components: 64
  frame_length: 128          # analysis frame L (>= n_components)
  hop: 64                    # stride along T=600 → ~9 frames + end-aligned
  normalize: mean_std        # closer to paper BN / mean-std than max-abs
  use_phase: true
  phase_mode: hilbert
  include_raw_column: false  # KLE columns = 8 α
  film_on_raw: false         # never FiLM the raw watts channel
  spec_residual: true        # zero-init residual from spectral emb → α
  embed_dim: 64
  conv_width: 32

architecture:
  input_channels: 9
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 8
  kernel_size: 5
  max_dilation: 64
  dropout: 0.15
  # Soft in train (stable w/ DA); hard at eval
  gate_mode: soft_train_hard_eval
  gate_threshold: 0.5
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  cross_appliance:
    enabled: true
    residual_scale: 0.5
  domain_feature_layers: [temporal_4, temporal_6, aligned]

loss:
  task_balance: equal
  lambda_state: 1
  pos_weight: auto
  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  # Warm up task first; then ramp DA (avoids early domain-grad blow-up)
  da_warmup_epochs: 0
  da_ramp_epochs: 0
  da_freeze_patience: 0
  lambda_domain: 0.6

domain_adaptation:
  enabled: true
  target_split: test

# Aligned with multinilm_fractional for fair ablation
training:
  batch_size: 64
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 20
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.000025
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
