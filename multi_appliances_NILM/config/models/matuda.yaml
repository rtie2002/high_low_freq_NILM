# MATUDA — MultiNILM training hyperparams + Lin-style global DA
# Train: python main.py --mode train_evaluate --model matuda
model_name: matuda

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  input_window_length: 600
  output_window_length: 600
  output_alignment: end
  input_stride: 300
  eval_stride: 300
  eval_reconstruction: auto
  training_targets: auto

architecture:
  # Matched to MultiNILM backbone dims; compact FC kept for Lin-style DA
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  detail_branch_channels: 16
  stem_kernels: [3, 5, 9]
  stage_kernel_size: 5
  tcn_blocks: 8
  tcn_kernel_size: 5
  max_dilation: 64
  # Smaller than old 96→512→256→128 so FC fits the C=128 MultiNILM trunk
  fc_dims: [256, 192, 128]
  dropout: 0.15
  use_gate: true
  gate_mode: hard
  gate_threshold: 0.5
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true

loss:
  task_balance: equal
  lambda_state: 1
  pos_weight: auto
  pos_weight_cap: 50
  on_masked_power: false
  # Lin TSG 2022: L=(1-λ)L_R + λ L_domain every epoch; best λ=0.6
  # No source-only warmup, no mid-train DA freeze, no pseudo-labels
  da_warmup_epochs: 0
  da_ramp_epochs: 0
  da_freeze_patience: 0
  pl_weight: 0.0
  da_mode: global
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  conditional_weight: 0.5
  lambda_domain: 0.6

domain_adaptation:
  enabled: true
  mode: global
  target_split: test

training:
  # Matched to config/models/multinilm.yaml
  batch_size: 32
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 60
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.000001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    # Also save a long ×10 context strip for each of the 5 focused ON situations.
    waveform_context_scale: 10
