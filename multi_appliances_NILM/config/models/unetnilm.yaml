# UNet-NILM paper-hyperparameter baseline on the shared 8-week dataset.
# Model/training settings follow Faustine et al. (NILM 2020). The dataset
# remains our mixed UK-DALE/REFIT benchmark, so this is not a reproduction of
# the paper's UK-DALE House 1, Jan-Mar 2015 data protocol.
# https://doi.org/10.1145/3427771.3427859
experiment_id: comparison_8w_unetnilm_paper_hparams
model_name: unetnilm

data:
  # Keep the common CSV labels so every model is evaluated against exactly the
  # same ground truth. The original paper generated labels with seq2quantile.
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  # The paper uses two-class softmax/argmax without threshold calibration and
  # does not gate its median power prediction with the predicted state.
  gate_power_by_state: false
  # The author code only clips negative predictions to 0 W. Disable our
  # benchmark's additional 5 W cutoff and appliance caps for this model.
  power_postprocess: false
  state_calibration:
    enabled: false

windowing:
  # Section 2.3: the preceding 100 aggregate samples predict the final point.
  # At this dataset's 8-second rate the context is 13.3 minutes (the paper's
  # UK-DALE data used 6 seconds, giving 10 minutes).
  input_window_length: 100
  output_window_length: 1
  output_alignment: end
  input_stride: 1
  eval_stride: 1
  eval_reconstruction: flat
  training_targets: output_window

architecture:
  input_channels: 1
  d_model: 128
  num_layers: 5
  features_start: 32       # official code: d_model / 4
  pool_size: 32            # official code: d_model / 4
  mlp_hidden: 1024
  # run_experiments() declares 0.25 but does not pass it to UNETNiLM;
  # therefore the author model actually uses its constructor default, 0.1.
  dropout: 0.1
  gate_threshold: 0.5

loss:
  # Paper Section 2.3. The official repository writes 0.0025 for the first
  # value, but the published paper explicitly specifies 2.5% = 0.025.
  quantiles: [0.025, 0.10, 0.50, 0.90, 0.975]

training:
  # Paper Section 2.3: 50 training iterations (epochs).
  epochs: 50
  batch_size: 256
  learning_rate: 0.001
  adam_betas: [0.9, 0.98]
  weight_decay: 0.0
  # The paper does not report a seed; the author experiment code uses 7777.
  seed: 7777
  tensor_dtype: float32
  train_shuffle: true
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: false

  # The author implementation clips gradients at 10.
  gradient_clip: 10.0
  use_amp: false
  amp_dtype: bf16
  tf32: false
  cudnn_benchmark: false
  torch_compile: false

  # The original implementation selects checkpoints and schedules LR by F1.
  checkpoint_monitor: val_f1
  # Early stopping is present but commented out in the author experiment.
  early_stop_patience: 0
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_f1
    patience: 5
    factor: 0.1
    min_lr: 0.000001

  # No background swap or other augmentation is added to this paper baseline.
  random_mix:
    enabled: false
    prob: 0.0

  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 5
    plot_max_batches: 64
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
