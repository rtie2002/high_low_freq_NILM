# Controlled shared-private experiment. The long-context encoder remains shared,
# but each appliance now owns its small raw/k=1 local expert. Everything else is
# identical to the paired-background reference run.
experiment_id: k4_alpha1_private_local_experts
model_name: multinilm_fractional

data:
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  # Final saved waveforms use the calibrated event state, so a reported OFF
  # sample cannot retain large appliance power.
  gate_power_by_state: true
  power_postprocess: false
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    apply_to_power: true
    power_gate:
      mode: hard
    postprocess:
      enabled: true
      # Use physical seconds so validation calibration keeps the same temporal
      # meaning if sample_seconds changes. Short-event loads stay permissive.
      min_on_seconds:
        kettle: 12
        fridge: 120
        dishwasher: 960
        washingmachine: 960
        microwave: 8
      merge_gap_seconds:
        kettle: 0
        fridge: 240
        dishwasher: 1800
        washingmachine: 960
        microwave: 16

windowing:
  # At 8 s/sample, each 1024-sample window spans about 136.5 min.
  input_window_length: 1024
  output_window_length: 1024
  output_alignment: end
  input_stride: 512
  eval_stride: 512
  eval_reconstruction: auto
  training_targets: auto

fractional:
  # Four GL channels (alpha 0.25, 0.5, 0.75, 1.0). Alpha=1 replaces signed delta.
  k: 4
  include_raw: true
  include_abs_delta: true
  # Return to the retained pre-local-contrast k4 encoder. The local-contrast
  # run produced implausible waveforms and is not part of this experiment.
  include_local_contrast: false
  include_rolling_mean: true
  include_rolling_std: true
  rolling_windows: [8, 23, 45]
  memory: 24
  channel_normalize: none

architecture:
  # 12 channels: raw, |GL alpha=1|, six rolling statistics and four GL channels.
  channel_schedule: [32, 64, 128]
  hidden_channels: 128

  # Retained: removing the parallel stem reduced validation AP and increased
  # microwave false-event count/false-positive energy.
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  stem_kernel_size: 7
  stage_kernel_size: 5

  # IBN in the early feature extractor improves cross-house robustness while
  # retaining amplitude-sensitive BatchNorm channels for appliance identity.
  stem_norm_type: ibn
  temporal_norm_type: batch
  head_norm_type: batch

  # Receptive-field ablation: k=9 with dilations 1,2,4,8,16 gives a 249-sample TCN RF.
  num_blocks: 5
  kernel_size: 9
  max_dilation: 16
  # Keep the original 0.25 dropout at every location. The values are separate
  # only so future ablations can change one component at a time.
  temporal_dropout: 0.25
  head_dropout: 0.25

  # Two local blocks preserve the multi-stage washing-machine waveform better.
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  task_attention:
    # Restore the retained baseline; do not combine its ablation with the new
    # local-contrast feature experiment.
    enabled: true
    reduction: 4

  # Retained tower output: each appliance has an independent power/state head.
  gate_mode: soft
  gate_threshold: 0.5

  # Every local expert receives raw aggregate, alpha=1 GL and |alpha=1 GL|.
  # The previous run shared one local expert across all appliances. That left
  # fridge and microwave local evidence under the same competing gradients.
  dual_expert:
    enabled: true
    share_local_expert: false
    local_channels: 32
    local_kernel_size: 5
    local_dilations: [1, 2, 4]
    local_norm_type: group
    dropout: 0.25
    gate_hidden_channels: 32
    gate_initial_local_weight: 0.1

  cross_appliance:
    # The no-relation ablation reduced microwave AP/F1 and increased high-
    # background false positives, so keep relational feature exchange enabled.
    enabled: true
    mode: relation_attention
    attention_channels: 16
    residual_scale: 0.25
    dropout: 0.25

# ---------------------------------------------------------------------------
# The retained supervised loss is unchanged.  The only new term compares two
# views with the same appliance targets and different residual backgrounds:
#
#   x_real = sum_i y_i + b_real
#   x_swap = sum_i y_i + b_swap
#
#   L = 0.5 * [L_sup(x_real) + L_sup(x_swap)]
#       + lambda_inv * [MSE(p_real, p_swap)
#                     + SmoothL1(yhat_real, yhat_swap)]
#
#   L_sup = L_power + state_term
#
#   L_power = sum_i [ MSE_i                                   all samples
#                   + power_on_weight    * ON_MSE_i           true-ON samples only
#                   + power_off_weight   * OFF_MSE_i          true-OFF samples only
#                   + power_delta_weight * DELTA_i            sample-to-sample change
#                   + power_energy_relative_weight * REL_ENERGY_i ]
#
#   L_state = sum_i [ BCE_i                                   ON samples x pos_weight_i
#                   + state_fp_weight     * FP_i ]            p^2 on true-OFF samples
#
#   state_term = lambda_state * L_state * stopgrad(L_power / L_state)
#
# Inside each supervised view, the stop-grad ratio fixes state_term at
# lambda_state * L_power. The total training loss additionally includes the
# background-consistency term above. L_state still sends gradients normally.
# To follow ON/OFF learning, read val_loss_state and val_loss_state_<app> in
# loss_detail.csv, and val_ap in history.csv.
#
# Each term is averaged over the batch, then summed over the 5 appliances.
# MSE, ON_MSE, OFF_MSE and DELTA use z-scored power (watts / appliance std), so
# a 1 kW microwave miss (std 111 W) costs far more than a 100 W fridge miss
# (std 60 W). REL_ENERGY is computed in watts.
# ---------------------------------------------------------------------------
loss:
  # equal: rescale L_state to the magnitude of L_power every batch, then apply
  #        lambda_state as a preference. none: lambda_state * raw L_state.
  task_balance: equal
  # After balancing, state_term = 0.8 * L_power in value.
  lambda_state: 0.8

  # BCE weight on ON samples: pos_weight_i = min(N_OFF / N_ON, cap), from the
  # training split ON rate. OFF samples keep weight 1. Rare appliances reach the cap.
  pos_weight: auto
  pos_weight_cap: 12

  # FP_i = mean of p^2 over true-OFF samples: extra push against false ON on top
  # of BCE. Removing it (0.0) reduced test performance.
  state_fp_weight: 1.0

  # ON_MSE_i / OFF_MSE_i are means over true-ON / true-OFF samples only. Added on
  # top of the all-sample MSE so the few ON samples are not drowned out.
  power_on_weight: 1.0
  power_off_weight: 0.5
  # DELTA_i = mean of ((y_hat[t] - y_hat[t-1]) - (y[t] - y[t-1]))^2. With
  # power_delta_on_only it only counts pairs where either sample is truly ON,
  # i.e. ON edges and the shape inside ON periods.
  power_delta_weight: 0.15
  power_delta_on_only: true
  # REL_ENERGY_i = mean over windows of |sum_t P_hat - sum_t P| / (sum_t P + T * floor),
  # in watts, with floor = energy_floor_watts per sample. The floor avoids division
  # by zero and still charges false power in all-OFF windows. It checks window
  # totals, not timing.
  power_energy_relative_weight: 0.25
  energy_floor_watts: 10

training:
  # Two forward views are retained for every anchor; halve the anchor batch so
  # GPU activation memory remains close to the previous batch_size=64 run.
  batch_size: 32
  epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  train_shuffle: true
  gradient_clip: 1.0

  # Replaced by the paired method below. Keeping both augmentation mechanisms
  # active would hide which one caused a performance change.
  random_mix:
    enabled: false
    mode: background_swap
    prob: 0.5

  # For every real training window, create one counterfactual view using the
  # same five appliance traces/states and an independently sampled residual.
  # Validation and test always remain recorded, unmodified aggregates.
  background_consistency:
    enabled: true
    weight: 0.1

  use_amp: false
  amp_dtype: bf16
  cudnn_benchmark: true
  tf32: true

  # AP evaluates state ranking without the arbitrary 0.5 training threshold.
  # Both terms are dimensionless and receive an equal unit-for-unit tradeoff:
  # score = normalized validation MAE + (1 - macro validation AP), lower is better.
  checkpoint_monitor: val_mae_plus_one_minus_ap
  checkpoint_mae_space: normalized
  early_stop_patience: 55
  early_stop_min_epochs: 100

  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_plus_one_minus_ap
    patience: 12
    factor: 0.5
    min_lr: 0.00001

  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    comparison_dpi: 300
