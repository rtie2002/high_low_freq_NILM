# Recovery baseline: restore the early relational model that was used before
# the dual-expert, local-contrast and mixture-output experiments. The new
# cross-house dataset split is intentionally retained.
experiment_id: multinilm_focal_event_stratified_mix_house_split
model_name: multinilm_fractional

data:
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    # Retain the calibrated hard power mask. A no-mask diagnostic greatly
    # increased OFF-state leakage and worsened MAE on every evaluation split.
    apply_to_power: true
    postprocess:
      enabled: true
      # Use physical seconds so validation calibration keeps the same temporal
      # meaning if sample_seconds changes. Short-event loads stay permissive.
      min_on_seconds:
        kettle: 12
        fridge: 120
        dishwasher: 960
        washingmachine: 960
        microwave: 8
      merge_gap_seconds:
        kettle: 0
        fridge: 240
        dishwasher: 1800
        washingmachine: 960
        microwave: 16

windowing:
  # At 8 s/sample, each 1024-sample window spans about 136.5 min.
  input_window_length: 1024
  output_window_length: 1024
  output_alignment: end
  input_stride: 512
  eval_stride: 512
  eval_reconstruction: auto
  training_targets: auto

fractional:
  # Exact early feature bank: 13 channels in total.
  k: 4
  include_raw: true
  include_delta: true
  include_abs_delta: true
  include_local_contrast: false
  include_rolling_mean: true
  include_rolling_std: true
  rolling_windows: [8, 23, 45]
  memory: 24
  channel_normalize: none

architecture:
  # 13 channels: raw, signed delta, |delta|, six rolling statistics and 4 GL.
  channel_schedule: [32, 64, 128]
  hidden_channels: 128

  # Retained: removing the parallel stem reduced validation AP and increased
  # microwave false-event count/false-positive energy.
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  stem_kernel_size: 7
  stage_kernel_size: 5

  # IBN in the early feature extractor improves cross-house robustness while
  # retaining amplitude-sensitive BatchNorm channels for appliance identity.
  stem_norm_type: ibn
  temporal_norm_type: batch
  head_norm_type: batch

  # Receptive-field ablation: k=9 with dilations 1,2,4,8,16 gives a 249-sample TCN RF.
  num_blocks: 5
  kernel_size: 9
  max_dilation: 16
  dropout: 0.25

  # Two local blocks preserve the multi-stage washing-machine waveform better.
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  task_attention:
    enabled: true
    reduction: 4

  gate_mode: soft
  gate_threshold: 0.5

  cross_appliance:
    enabled: true
    mode: relation_attention
    attention_channels: 16
    residual_scale: 0.25
#
# Retained early supervised objective:
#   L = L_power + state_term
#
#   L_power = sum_i [ MSE_i                                   all samples
#                   + power_on_weight    * ON_MSE_i           true-ON samples only
#                   + power_off_weight   * OFF_MSE_i          true-OFF samples only
#                   + power_delta_weight * DELTA_i            sample-to-sample change
#                   + power_energy_relative_weight * REL_ENERGY_i ]
#
#   L_state = sum_i [ BCE_i                                   ON samples x pos_weight_i
#                   + state_fp_weight     * FP_i ]            p^2 on true-OFF samples
#
#   state_term = lambda_state * L_state * stopgrad(L_power / L_state)
#
# The stop-grad ratio fixes state_term at lambda_state * L_power in value.
# L_state still sends gradients normally.
# To follow ON/OFF learning, read val_loss_state and val_loss_state_<app> in
# loss_detail.csv, and val_ap in history.csv.
#
# Each term is averaged over the batch, then summed over the 5 appliances.
# MSE, ON_MSE, OFF_MSE and DELTA use z-scored power (watts / appliance std), so
# a 1 kW microwave miss (std 111 W) costs far more than a 100 W fridge miss
# (std 60 W). REL_ENERGY is computed in watts.
# ---------------------------------------------------------------------------
loss:
  # equal: rescale L_state to the magnitude of L_power every batch, then apply
  #        lambda_state as a preference. none: lambda_state * raw L_state.
  task_balance: equal
  # After balancing, state_term = 0.8 * L_power in value.
  lambda_state: 0.8

  # BCE weight on ON samples: pos_weight_i = min(N_OFF / N_ON, cap), from the
  # training split ON rate. OFF samples keep weight 1. Rare appliances reach the cap.
  pos_weight: auto
  pos_weight_cap: 12

  # FP_i = mean of p^2 over true-OFF samples: extra push against false ON on top
  # of BCE. Removing it (0.0) reduced test performance.
  state_fp_weight: 1.0

  # ON_MSE_i / OFF_MSE_i are means over true-ON / true-OFF samples only. Added on
  # top of the all-sample MSE so the few ON samples are not drowned out.
  power_on_weight: 1.0
  power_off_weight: 0.5
  # DELTA_i = mean of ((y_hat[t] - y_hat[t-1]) - (y[t] - y[t-1]))^2. With
  # power_delta_on_only it only counts pairs where either sample is truly ON,
  # i.e. ON edges and the shape inside ON periods.
  power_delta_weight: 0.15
  power_delta_on_only: true
  # REL_ENERGY_i = mean over windows of |sum_t P_hat - sum_t P| / (sum_t P + T * floor),
  # in watts, with floor = energy_floor_watts per sample. The floor avoids division
  # by zero and still charges false power in all-OFF windows. It checks window
  # totals, not timing.
  power_energy_relative_weight: 0.25
  energy_floor_watts: 10

training:
  batch_size: 64
  epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  train_shuffle: true
  gradient_clip: 1.0

  # Early 50:50 augmentation: each target appliance and residual background
  # are drawn independently. Validation and test stay fully recorded/real.
  random_mix:
    enabled: true
    mode: full
    prob: 0.5
    # Preserve the original additive full mix, but make its sampling useful:
    # every synthetic window contains one real ON appliance window, while the
    # residual background is drawn uniformly from the non-empty power ranges.
    # This tests event/background coverage without changing the architecture,
    # loss, real-data half, validation split, or evaluation pipeline.
    focal_event_sampling:
      enabled: true
      # Apply this to every synthetic window. The controlled p=0.25 ablation
      # reduced the validation AP and lost part of the fridge-FPR improvement.
      prob: 1.0
      background_bins_watts: [0, 100, 200, 400, 800]

  use_amp: false
  amp_dtype: bf16
  cudnn_benchmark: true
  tf32: true

  # AP evaluates state ranking without the arbitrary 0.5 training threshold.
  # Both terms are dimensionless and receive an equal unit-for-unit tradeoff:
  # score = normalized validation MAE + (1 - macro validation AP), lower is better.
  checkpoint_monitor: val_mae_plus_one_minus_ap
  checkpoint_mae_space: normalized
  early_stop_patience: 55
  early_stop_min_epochs: 100

  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_plus_one_minus_ap
    patience: 12
    factor: 0.5
    min_lr: 0.00001

  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    comparison_dpi: 300
