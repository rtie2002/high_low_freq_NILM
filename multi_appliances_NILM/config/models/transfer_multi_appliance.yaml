# BERT4NILM transfer-learning baseline (TransferNILM.py)
# Training hyperparameters aligned with NILM_model/baseline/transfer_learning_multi-appliance.
model_name: transfer_multi_appliance

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  input_window_length: 480
  output_window_length: 480
  output_alignment: end
  # Baseline create_dataset.py uses chunk_size=240 (Arguments window_stride=120 is unused).
  input_stride: 240
  eval_stride: 240
  eval_reconstruction: overlap_mean
  training_targets: full_input

architecture:
  hidden: 256
  attn_heads: 2
  encoder_layers: 2
  head_transformer_layers: 1
  dropout: 0.1

transfer:
  freeze_encoder: false

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0
  seed: 155
  tensor_dtype: float64
  train_shuffle: true
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 60
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.000001
  gradient_clip: 0.0
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    feature_maps:
      enabled: true
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
