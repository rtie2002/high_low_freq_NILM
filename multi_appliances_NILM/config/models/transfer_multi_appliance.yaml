# Five-appliance external architecture baseline for the mixed UK-DALE/REFIT 8-week data.
# The model keeps its native BERT4NILM-style shared Transformer + independent
# appliance heads and simple MSE+BCE objective. Dataset labels, model selection,
# calibration and metrics are aligned with MultiNILM for a meaningful comparison.
experiment_id: comparison_8w_transfer_multi_appliance
model_name: transfer_multi_appliance

data:
  # Use the exact CSV labels used by MultiNILM, not a second threshold-derived
  # ground truth definition.
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    apply_to_power: true
    postprocess:
      enabled: true
      min_on_seconds:
        kettle: 12
        fridge: 120
        dishwasher: 960
        washingmachine: 960
        microwave: 8
      merge_gap_seconds:
        kettle: 0
        fridge: 240
        dishwasher: 1800
        washingmachine: 960
        microwave: 16

windowing:
  # Match the current MultiNILM physical context (1024 x 8 s = 136.5 min).
  # This makes the run an architecture-controlled comparison rather than a
  # comparison confounded by different information horizons.
  input_window_length: 1024
  output_window_length: 1024
  output_alignment: end
  input_stride: 512
  eval_stride: 512
  eval_reconstruction: overlap_mean
  training_targets: full_input

architecture:
  hidden: 256
  attn_heads: 2
  encoder_layers: 2
  head_transformer_layers: 1
  dropout: 0.1

transfer:
  freeze_encoder: false

training:
  batch_size: 32
  epochs: 150
  learning_rate: 0.0001
  weight_decay: 0
  seed: 2026
  # Float64 was inherited from an old baseline script. It changes no model
  # semantics but roughly doubles memory and compute cost on the RTX 4090.
  tensor_dtype: float32
  train_shuffle: true
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  # Use threshold-free validation AP in checkpoint selection, consistent with
  # the current MultiNILM protocol.
  checkpoint_monitor: val_mae_plus_one_minus_ap
  checkpoint_mae_space: normalized
  early_stop_patience: 55
  early_stop_min_epochs: 100
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_plus_one_minus_ap
    patience: 12
    factor: 0.5
    min_lr: 0.00001
  gradient_clip: 1.0

  # Match the data distribution used by the current MultiNILM run. The network
  # and objective remain the baseline's own Transformer + simple MSE+BCE.
  random_mix:
    enabled: true
    mode: background_swap
    prob: 0.5
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
