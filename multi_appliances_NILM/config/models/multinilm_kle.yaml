# MultiNILM + KLE front-end: dataloader stays 1D; model expands to C=9 channels.
# C = raw + 8 KLE FIR subspace components (see model/MultiNILM_kle.py).
model_name: multinilm_kle

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  input_window_length: 600
  output_window_length: 600
  output_alignment: end
  input_stride: 300
  eval_stride: 300
  eval_reconstruction: auto
  training_targets: auto

# KLE → multi-channel 1D (connected to preprocess_feature/kle.py)
kle:
  n_components: 8
  include_raw: true          # → feature_channels = 9
  demean: true
  channel_normalize: mean_std

architecture:
  # Stem in_channels is forced to 9 by build_multinilm_kle; keep for readability.
  input_channels: 9
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 8
  kernel_size: 5
  max_dilation: 64
  dropout: 0.15
  gate_mode: hard
  gate_threshold: 0.5
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  cross_appliance:
    enabled: true
    residual_scale: 0.5
  domain_feature_layers: [temporal_4, temporal_6, aligned]

loss:
  task_balance: equal
  lambda_state: 1
  pos_weight: auto
  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  lambda_domain: 0

domain_adaptation:
  enabled: false
  target_split: test

training:
  batch_size: 16
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 60
  scheduler: none
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 5
    factor: 0.5
    min_lr: 0.000001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
