# Multi-appliance relational NILM experiment.
# Keeps the precision_guard baseline reproducible while testing:
#   task attention + cross-appliance relation attention + physical losses.
experiment_id: Clean Version (detail_branch_channels)
model_name: multinilm_fractional

data:
  mains_column: aggregate
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  regate_power_with_pred_on: true
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    apply_to_power: true
    postprocess:
      enabled: true
      # Use physical seconds so validation calibration keeps the same temporal
      # meaning if sample_seconds changes. Short-event loads stay permissive.
      min_on_seconds:
        kettle: 12
        fridge: 120
        dishwasher: 960
        washingmachine: 960
        microwave: 8
      merge_gap_seconds:
        kettle: 0
        fridge: 240
        dishwasher: 1800
        washingmachine: 960
        microwave: 16

windowing:
  # 1024 x 8 s gives 2.28 h context and lowers memory/step time.
  # Use 1536 samples to preserve the old 2048 x 6 s context (3.41 h).
  input_window_length: 1024
  output_window_length: 1024
  output_alignment: end
  input_stride: 512
  eval_stride: 512
  eval_reconstruction: auto
  training_targets: auto

fractional:
  enabled: true
  k: 4
  include_raw: true
  include_delta: true
  include_abs_delta: true
  include_rolling_mean: true
  include_rolling_std: true
  rolling_windows: [8, 23, 45]
  memory: 24
  channel_normalize: none

architecture:
  channel_schedule: [32, 64, 128]
  hidden_channels: 128

  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  stem_kernel_size: 7
  stage_kernel_size: 5

  # IBN in the early feature extractor improves cross-house robustness while
  # retaining amplitude-sensitive BatchNorm channels for appliance identity.
  stem_norm_type: ibn
  temporal_norm_type: batch
  head_norm_type: batch

  # Receptive-field ablation: k=9 with dilations 1,2,4,8,16 gives a 249-sample TCN RF.
  num_blocks: 5
  kernel_size: 9
  max_dilation: 16
  dropout: 0.25

  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  task_attention:
    enabled: true
    reduction: 4

  gate_mode: soft
  gate_threshold: 0.5

  cross_appliance:
    enabled: true
    mode: relation_attention
    attention_channels: 16
    residual_scale: 0.25

  domain_feature_layers: [temporal_3, aligned]

loss:
  task_balance: equal
  lambda_state: 0.8
  pos_weight: auto
  # ON-class BCE weight: min(N_OFF / N_ON, cap); negatives keep weight 1.
  pos_weight_cap: 12

  state_fp_weight: 1.0  # Keep explicit false-ON suppression; removing it reduced test performance.
  state_transition_weight: 0.20

  power_on_weight: 1.0
  power_off_weight: 0.5
  power_delta_weight: 0.15
  power_delta_on_only: true
  power_energy_weight: 0.0
  power_energy_relative_weight: 0.25
  energy_floor_watts: 10

  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  lambda_domain: 0.0
  da_warmup_epochs: 0
  da_ramp_epochs: 0
  da_freeze_patience: 0

domain_adaptation:
  enabled: false
  target_split: test

training:
  batch_size: 64
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  train_shuffle: true
  gradient_clip: 1.0

  use_amp: false
  amp_dtype: bf16
  cudnn_benchmark: true
  tf32: true

  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  checkpoint_mae_weight: 7.0
  early_stop_patience: 55
  early_stop_min_epochs: 100

  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 12
    factor: 0.5
    min_lr: 0.00001

  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 10
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    comparison_dpi: 600
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
