# Multi-appliance relational NILM experiment.
# Keeps the precision_guard baseline reproducible while testing:
#   task attention + cross-appliance relation attention + physical losses.
experiment_id: extra_feature_relational_physics
model_name: multinilm_fractional

data:
  mains_column: aggregate
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  regate_power_with_pred_on: true
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    apply_to_power: true
    postprocess:
      enabled: true
      # One sample is 6 s. Microwave/kettle have many genuine short events.
      min_on_samples:
        kettle: 3
        fridge: 20
        dishwasher: 160
        washingmachine: 300
        microwave: 3
      merge_gap_samples:
        kettle: 0
        fridge: 40
        dishwasher: 300
        washingmachine: 160
        microwave: 2

windowing:
  input_window_length: 2048
  output_window_length: 2048
  output_alignment: end
  input_stride: 1024
  eval_stride: 1024
  eval_reconstruction: auto
  training_targets: auto

fractional:
  enabled: true
  k: 4
  include_raw: true
  include_delta: false
  include_abs_delta: true
  include_rolling_mean: true
  include_rolling_std: true
  rolling_windows: [10, 30, 60]
  memory: 32
  channel_normalize: none

architecture:
  channel_schedule: [32, 64, 128]
  hidden_channels: 128

  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  stem_kernel_size: 7
  stage_kernel_size: 5

  # IBN only at the early feature extractor: half the channels are made less
  # house-style-sensitive, while the BatchNorm half preserves amplitude cues.
  stem_norm_type: ibn
  temporal_norm_type: batch
  head_norm_type: batch

  # k=9 and dilations 1..64 give a 1017-sample (~102 min) receptive field.
  num_blocks: 7
  kernel_size: 9
  max_dilation: 64
  dropout: 0.25

  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  task_attention:
    enabled: true
    reduction: 4

  gate_mode: soft
  gate_threshold: 0.5

  cross_appliance:
    enabled: true
    mode: relation_attention
    attention_channels: 16
    residual_scale: 0.25

  domain_feature_layers: [temporal_3, temporal_6, aligned]

loss:
  task_balance: equal
  lambda_state: 0.8
  pos_weight: auto
  pos_weight_cap: 12

  state_fp_weight: 1.0
  state_transition_weight: 0.20

  power_on_weight: 1.0
  power_off_weight: 0.5
  power_delta_weight: 0.15
  power_delta_on_only: true
  power_energy_weight: 0.0
  power_energy_relative_weight: 0.25
  energy_floor_watts: 10

  # Only penalize impossible over-allocation. The unmodelled/other load is
  # allowed to remain in aggregate - sum(predicted appliances).
  aggregate_consistency_weight: 1.0
  aggregate_tolerance_watts: 30
  aggregate_loss_scale_watts: 1000

  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  lambda_domain: 0.0
  da_warmup_epochs: 0
  da_ramp_epochs: 0
  da_freeze_patience: 0

domain_adaptation:
  enabled: false
  target_split: test

training:
  batch_size: 64
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  train_shuffle: true
  gradient_clip: 1.0

  # MATNilm-inspired, physically consistent profile scaling. The unknown
  # residual is kept as a separate component when rebuilding aggregate.
  augmentation:
    enabled: true
    probability: 0.8
    appliance_gain: [0.80, 1.25]
    residual_gain: [0.50, 1.25]

  use_amp: false
  amp_dtype: bf16
  cudnn_benchmark: true
  tf32: true

  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  checkpoint_mae_weight: 7.0
  early_stop_patience: 55
  early_stop_min_epochs: 100

  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 12
    factor: 0.5
    min_lr: 0.00001

  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    comparison_dpi: 600
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 10
      dpi: 200
