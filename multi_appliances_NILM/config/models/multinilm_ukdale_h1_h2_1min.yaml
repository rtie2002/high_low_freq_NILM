# MultiNILM for UK-DALE 1-minute cross-house validation.
# Window units are samples, so 240 samples = 240 minutes = 4 hours.
experiment_id: ukdale_h1_train_h2_test_1min
model_name: multinilm

data:
  mains_column: aggregate
  state_label_source: csv

evaluation:
  pred_on_source: state_head
  regate_power_with_pred_on: true
  state_calibration:
    enabled: true
    split: validation
    threshold_grid: [0.05, 0.98, 0.01]
    apply_to_power: true
    postprocess:
      enabled: true
      min_on_samples:
        kettle: 1
        fridge: 2
        dishwasher: 30
        washingmachine: 30
        microwave: 1
      merge_gap_samples:
        kettle: 0
        fridge: 4
        dishwasher: 30
        washingmachine: 3
        microwave: 1

windowing:
  input_window_length: 240
  output_window_length: 240
  output_alignment: end
  input_stride: 120
  eval_stride: 120
  eval_reconstruction: auto
  training_targets: auto

architecture:
  input_channels: 1
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 6
  kernel_size: 5
  max_dilation: 32
  dropout: 0.15
  gate_mode: hard
  gate_threshold: 0.5
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  cross_appliance:
    enabled: true
    residual_scale: 0.5
  domain_feature_layers: [temporal_2, temporal_4, aligned]

loss:
  task_balance: equal
  lambda_state: 1.0
  pos_weight: auto
  pos_weight_cap: 12
  state_fp_weight: 1.0
  power_on_weight: 1.0
  power_off_weight: 0.5
  power_delta_weight: 0.1
  power_delta_on_only: true
  power_energy_weight: 0.03
  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  lambda_domain: 0.0

domain_adaptation:
  enabled: false
  target_split: test

training:
  batch_size: 64
  epochs: 160
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  use_amp: false
  amp_dtype: bf16
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  checkpoint_mae_weight: 7.0
  early_stop_patience: 45
  early_stop_min_epochs: 60
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 10
    factor: 0.5
    min_lr: 0.00001
  gradient_clip: 1.0
  train_shuffle: true
  cudnn_benchmark: true
  tf32: true
  plots:
    plot_mode: interval
    plot_interval: 50
    plot_on_periods: 5
    plot_max_batches: 16
    waveform_figsize: 5.5
    waveform_dpi: 300
    waveform_dynamic_figsize: true
    on_period_margin_min: 40
    on_period_margin_frac: 0.08
    waveform_context_scale: 10
    comparison_dpi: 600
    feature_maps:
      enabled: false
      max_examples: 2
      cmap: magma
      display_activation: relu
      min_on_duration: 2
      dpi: 200
