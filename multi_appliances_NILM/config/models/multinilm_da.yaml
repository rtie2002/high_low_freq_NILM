# MultiNILM + Lin-style unsupervised DA (H1+H5 → unlabeled H2)
# Same backbone as multinilm.yaml; only DA switched on.
model_name: multinilm

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  input_window_length: 480
  output_window_length: 480
  output_alignment: end
  input_stride: 240
  eval_stride: 240
  eval_reconstruction: auto
  training_targets: auto

architecture:
  input_channels: 1
  channel_schedule: [32, 64, 128]
  hidden_channels: 128
  stem_kernel_size: 7
  stage_kernel_size: 5
  num_blocks: 8
  kernel_size: 5
  max_dilation: 64
  dropout: 0.15
  gate_mode: hard
  gate_threshold: 0.5
  head_local_layers: 2
  head_kernel_size: 3
  head_use_residual: true
  use_multiscale_stem: true
  detail_kernels: [3, 5, 9]
  detail_branch_channels: 16
  cross_appliance:
    enabled: true
    residual_scale: 0.5
  domain_feature_layers: [temporal_4, temporal_6, aligned]

loss:
  task_balance: equal
  lambda_state: 1
  pos_weight: auto
  domain_method: both
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  # Lin TSG best λ ≈ 0.6
  lambda_domain: 0.6

domain_adaptation:
  enabled: true
  target_split: test

training:
  batch_size: 32
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0
  num_workers: 0
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 40
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 10
    factor: 0.5
    min_lr: 0.000001
  gradient_clip: 5.0
  train_shuffle: true
  cudnn_benchmark: true
  plots:
    plot_mode: interval
    plot_interval: 25
    n_waveform_periods: 3
