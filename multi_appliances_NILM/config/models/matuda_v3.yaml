# MATUDA v3 — literature fixes after F1=0 collapse diagnosis
# - Eval bug fixed in adapters/common.py (prob→int32 truncation)
# - Hur et al. Sensors 2022: confident target pseudo-labels
# - AHDA/Lin: EGC conditional MMD+CORAL on FC layers
# - D'Incecco/Zhong: stronger classification head before transfer
model_name: matuda

data:
  mains_column: aggregate
  state_label_source: threshold

evaluation:
  pred_on_source: state_head

windowing:
  # Seq2seq (Lin / MultiNILM style): full-window targets
  input_window_length: 480
  output_window_length: 480
  output_alignment: end
  input_stride: 240
  eval_stride: 240
  eval_reconstruction: auto
  training_targets: auto

architecture:
  conv_channels: 96
  tcn_blocks: 8
  fc_dims: [512, 256, 128]
  dropout: 0.15
  use_gate: true
  gate_mode: soft
  stem_kernels: [3, 5, 9]
  head_hidden: 64
  head_kernel_size: 3

loss:
  # Identical to MultiNILM supervised: per-app MSE + BCE + equal balance.
  task_balance: equal
  lambda_state: 1          # with equal balance → power ↔ state same weight
  pos_weight: auto
  pos_weight_cap: 50
  on_masked_power: false   # true = ON-only MSE (MATUDA extra); false = MultiNILM MSE
  # Hur Sensors 2022: source-only then DA + confident target PL
  da_warmup_epochs: 30
  pl_weight: 0.3
  pl_confidence: 0.9
  da_mode: egc
  domain_mu: 0.4
  domain_mix: convex
  domain_scale: equal
  conditional_weight: 0.5
  lambda_domain: 0.5

domain_adaptation:
  enabled: true
  mode: egc
  target_split: test

training:
  batch_size: 32
  epochs: 150
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  checkpoint_monitor: val_mae_minus_f1
  checkpoint_mae_space: normalized
  early_stop_patience: 50
  scheduler: reduce_on_plateau
  lr_scheduler:
    type: reduce_on_plateau
    monitor: val_mae_minus_f1
    patience: 10
    factor: 0.5
    min_lr: 0.00001
  gradient_clip: 5.0
  train_shuffle: true
  cudnn_benchmark: true
  plots:
    plot_mode: interval
    plot_interval: 25
    n_waveform_periods: 3
