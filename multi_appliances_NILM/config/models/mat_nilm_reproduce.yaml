# MATNILM — author-faithful (slow on full UK-DALE: ~35 min/epoch, stride 1, ~805k windows)
# Use mat_nilm.yaml (fast) for normal UK-DALE cross-house training.

model:
  name: mat_nilm
  task: multi_appliance_joint

windowing:
  input_window_length: 864
  output_window_length: 64
  output_alignment: center
  input_stride: 1
  eval_stride: 64
  training_targets: full_input

architecture:
  input_size: 1
  hidden: 32
  dropout: 0.1
  num_appliances: 4

data:
  appliances: [dishwasher, fridge, microwave, washingmachine]
  mains_column: aggregate
  power_scale: 612.0
  state_threshold_watts: 15.0

training:
  epochs: 200
  batch_size: 32
  learning_rate: 0.001
  optimizer: Adam
  weight_decay: 0.0
  gradient_clip: 0.0
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  use_amp: true
  amp_dtype: bf16
  tf32: true
  cudnn_benchmark: true
  torch_compile: false
  seed: 2026
  checkpoint_monitor: val_mae
  early_stop_patience: 30

  plots:
    plot_mode: interval
    plot_interval: 10
    plot_on_periods: 3
    on_period_samples: 0
    full_cycle_appliances: [washingmachine, dishwasher]
    plot_max_batches: 32

loss:
  power: mse
  state: bce
  combine: power_loss + state_loss
