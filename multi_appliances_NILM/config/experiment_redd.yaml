# REDD (4 appliances) — data / protocol only (H1+H3 → H2 CSVs).
# Built by: python scripts/prepare_redd_crosshouse_split.py
# Run-folder name: set experiment_id on the model yaml.
dataset_id: redd
seed: 2026
data_root: datasets/redd

csv:
  train_file: training/multi_appliance_training.csv
  validation_file: validating/multi_appliance_validating.csv
  test_file: testing/multi_appliance_testing.csv
  mains_column: aggregate
  appliances:
    dishwasher:     {power: dishwasher_power,     state: dishwasher_on}
    fridge:         {power: fridge_power,         state: fridge_on}
    microwave:      {power: microwave_power,      state: microwave_on}
    washingmachine: {power: washingmachine_power, state: washingmachine_on}

normalization:
  # From baseline Arguments.redd_params_appliance (approx.)
  aggregate: {mean: 300, std: 550}
  appliances:
    dishwasher:     {mean: 700, std: 1000}
    fridge:         {mean: 200, std: 400}
    microwave:      {mean: 500, std: 800}
    washingmachine: {mean: 400, std: 700}

evaluation:
  on_thresholds_watts:
    dishwasher: 10
    fridge: 50
    microwave: 200
    washingmachine: 20
  max_on_power_watts:
    dishwasher: 3964
    fridge: 2848
    microwave: 3969
    washingmachine: 3999
  power_postprocess:
    enabled: true
    min_power_watts: 5
  sae_period: 1200
  power_unit: watts
