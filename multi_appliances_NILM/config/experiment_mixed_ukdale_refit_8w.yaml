# Mixed UK-DALE + REFIT (5 appliances) — 8-week active blocks / house.
# Built by: python scripts/prepare_mixed_ukdale_refit_3week_split.py \
#             --block-weeks 8 --step-days 2 --out-dir datasets/mixed_ukdale_refit_8w
#
# Identical protocol to experiment_mixed_ukdale_refit_3w.yaml; only the block
# length changed, so a run on this file isolates the effect of training volume.
#   Source (8 wk each, then 80/20 train/val with active val tail):
#     UK-DALE 1,5 + REFIT 2,3,5,9,11
#   Test (8 wk each, maximin active):
#     UK-DALE 2 + REFIT 20
#
# Versus the 3-week build: train 1.25M -> 3.30M rows, and the test split gains
# enough rare-appliance events to be stable (dishwasher 23 -> 74, WM 15 -> 61).
dataset_id: mixed_ukdale_refit_8w
seed: 2026
data_root: datasets/mixed_ukdale_refit_8w

csv:
  sample_seconds: 8
  train_file: training/multi_appliance_training.csv
  validation_file: validating/multi_appliance_validating.csv
  test_file: testing/multi_appliance_testing.csv
  # Independent zero-shot scenarios. They use the same validation calibration
  # but are evaluated and saved in separate output folders.
  test_scenarios:
    refit_house20: testing/refit_house20/multi_appliance_testing.csv
    ukdale_house2: testing/ukdale_house2/multi_appliance_testing.csv
  mains_column: aggregate
  appliances:
    kettle:         {power: kettle_power,         state: kettle_on}
    fridge:         {power: fridge_power,         state: fridge_on}
    dishwasher:     {power: dishwasher_power,     state: dishwasher_on}
    washingmachine: {power: washingmachine_power, state: washingmachine_on}
    microwave:      {power: microwave_power,      state: microwave_on}

# Generated from the mixed TRAIN split only, then reused unchanged for val/test.
# Training fails clearly if this artifact has not been regenerated.
normalization_file: ../datasets/mixed_ukdale_refit_8w/normalization_stats.json

evaluation:
  on_thresholds_watts:
    kettle: 40
    fridge: 50
    dishwasher: 30
    washingmachine: 30
    microwave: 100
  max_on_power_watts:
    kettle: 4000
    fridge: 4000
    dishwasher: 4000
    washingmachine: 3999
    microwave: 4000
  power_postprocess:
    enabled: true
    min_power_watts: 5
  sae_period: 1200
  power_unit: watts
