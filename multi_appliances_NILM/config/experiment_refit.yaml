# REFIT (5 appliances) — update CSV filenames if your export differs
experiment_id: refit_multi_appliance
seed: 2026
data_root: datasets/refit

csv:
  train_file: training/multi_appliance_training.csv
  validation_file: validating/multi_appliance_validating.csv
  test_file: testing/multi_appliance_testing.csv
  mains_column: aggregate
  appliances:
    kettle:         {power: kettle_power,         state: kettle_on}
    fridge:         {power: fridge_power,         state: fridge_on}
    dishwasher:     {power: dishwasher_power,     state: dishwasher_on}
    washingmachine: {power: washingmachine_power, state: washingmachine_on}
    microwave:      {power: microwave_power,      state: microwave_on}

normalization:
  aggregate: {mean: 500, std: 800}
  appliances:
    kettle:         {mean: 50,  std: 80}
    fridge:         {mean: 350, std: 700}
    dishwasher:     {mean: 100, std: 400}
    washingmachine: {mean: 100, std: 500}
    microwave:      {mean: 500, std: 800}

evaluation:
  on_threshold_watts: 15.0
  sae_period: 1200
  power_unit: watts
