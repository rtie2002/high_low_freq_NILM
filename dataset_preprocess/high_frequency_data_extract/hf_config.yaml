paths:
  # Destination directory for the extracted high-frequency feature CSVs
  save_path: "output"

hyperparameters:
  # High-frequency specific settings
  high_frequency:
    sampling_rate: 16000     # Expected sampling rate of the audio files (16kHz for UK-DALE)
    mains_frequency: 50      # Power grid frequency (50Hz for UK)
  
  # Sliding window size for extraction (Aligned perfectly with the submeter 6s resolution)
  window_size_seconds: 6   
  
  # Timezone for logging (Options: "UTC", "Europe/London")
  timezone: "Europe/London"

  # Channel Mapping configuration
  channel_config:
    voltage_idx: 0         # 0 = Left channel (Standard UK-DALE Voltage tracking)
    current_idx: 1         # 1 = Right channel (Standard UK-DALE Current tracking)

features_to_extract:
  # --- Time Domain (Atomic) ---
  time_domain:
    enabled: true          # Master switch for time-domain layer
    v_rms: true            # Voltage Root Mean Square
    i_rms: true            # Current Root Mean Square
    p_active: true         # Active Power (Watts) - Real work done
    q_reactive: true       # Reactive Power (Vars) - Inductive/Capacitive energy
    s_apparent: true       # Apparent Power (VA) - Total power envelope
    pf: true               # Power Factor (P/S) - Efficiency metric
    fcv: true              # Voltage Crest Factor (Peak/RMS)
    fci: true              # Current Crest Factor (Peak/RMS) - Detects spiky loads

  # --- Harmonic Analysis (Atomic) ---
  harmonic_analysis:
    enabled: true          # Master switch for FFT harmonic layer
    # Specific orders to compute (Example: [1, 3, 5] for odd harmonics only)
    orders: [1, 3, 5, 7, 9, 11, 13, 15] 
    # Metrics to save for EACH requested order k
    pk: true               # Active Power at harmonic k
    qk: true               # Reactive Power at harmonic k
    ik: true               # Current Magnitude at harmonic k
    sk: true               # Apparent Power at harmonic k
    vk: true               # Voltage Magnitude at harmonic k

  # --- Distortion Metrics (Atomic) ---
  distortion_metrics:
    enabled: true          # Master switch for power quality/distortion layer
    ph: true               # Sum of Active Power for all harmonics (k >= 2)
    qh: true               # Sum of Reactive Power for all harmonics (k >= 2)
    ih: true               # Aggregate Harmonic Current (I_H)
    vh: true               # Aggregate Harmonic Voltage (V_H)
    sh: true               # Aggregate Harmonic Apparent Power (S_H)
    d: true                # Distortion Power (D = sqrt(S^2 - P^2 - Q^2))
    sn: true               # Non-fundamental Apparent Power (S_N)
    di: true               # Current Distortion Power (D_I)
    dv: true               # Voltage Distortion Power (D_V)
    thdi: true             # Total Harmonic Distortion - Current (THD_i)
    thdv: true             # Total Harmonic Distortion - Voltage (THD_v)

  # --- Wavelet Domain ---
  wavelet_domain:
    enabled: true          # Master switch for DWT transient layer
    levels: 4              # Decomposition depth (0-4). Higher = more frequency bands
