paths:
  # Destination directory for the extracted high-frequency feature CSVs
  save_path: "output"
  # Root folder containing house_X/year/wkXX FLAC trees (relative to this yaml file)
  data_root: "../UK_DALE_16khz"
  # Low-frequency ukdale.yaml for fusion (relative to this yaml file)
  lf_config: "../../config/preprocess/ukdale.yaml"

# Automatic batch: process full week(s) → one fused CSV per appliance per week.
# Run: python high_frequency_data_extract.py   (no CLI args needed)
# Or override: python high_frequency_data_extract.py --weeks wk30,wk31 --appliances kettle,fridge
batch:
  enabled: true
  house: 2
  year: 2013
  weeks: ["wk24", "wk25"]
  # Which appliances to fuse & save (must match ukdale.yaml names).
  # []  = all five: kettle, fridge, microwave, dishwasher, washingmachine
  # Or list only what you want, e.g.:
  # appliances: [kettle, fridge]
  appliances: []
  fuse_lf: true
  save_hf_csv_per_flac: false   # true = also save features_vi-*.csv per hour

logging:
  verbose_windows: false        # false = much faster; true = print every 6s window

hyperparameters:
  house_id: 2
  # High-frequency specific settings
  high_frequency:
    sampling_rate: 16000     # Expected sampling rate of the audio files (16kHz for UK-DALE)
    mains_frequency: 50      # Power grid frequency (50Hz for UK)
  
  # Sliding window size for extraction (Aligned perfectly with the submeter 6s resolution)
  window_size_seconds: 6   
  
  # Timezone for logging (Options: "UTC", "Europe/London")
  timezone: "Europe/London"

  # Channel Mapping configuration
  channel_config:
    voltage_idx: 0         # 0 = Left channel (Standard UK-DALE Voltage tracking)
    current_idx: 1         # 1 = Right channel (Standard UK-DALE Current tracking)

features_to_extract:
  # --- Level 1: Time Domain (Waveform Stats) ---
  time_domain:
    enabled: true          # Master switch for time-domain layer
    v_rms: true            # Voltage Root Mean Square
    i_rms: true            # Current Root Mean Square
    p_active: true         # Active Power (Watts)
    s_apparent: true       # Apparent Power (VA)
    pf: true               # Power Factor (P/S)
    fcv: true              # Voltage Crest Factor
    fci: true              # Current Crest Factor

  shape_statistics:        # Morphological descriptors
    enabled: true          # Master switch
    i_skew: true           # Current asymmetry
    i_kurt: true           # Current peakedness
    v_skew: true           # Voltage asymmetry
    i_std: true            # Current standard deviation
    v_std: true            # Voltage standard deviation

  # --- Level 2: Spectral Analysis (FFT) ---
  harmonic_analysis:
    enabled: true          # Master switch
    orders: [1, 3, 5, 7, 9, 11, 13, 15] 
    harmonic_band_hz: 15.0
    ik: true               # Current Magnitude at harmonic k
    vk: true               # Voltage Magnitude at harmonic k

  distortion_metrics:
    enabled: true          # Master switch
    ih: true               # Aggregate Harmonic Current (I_H)
    vh: true               # Aggregate Harmonic Voltage (V_H)
    thdi: true             # Total Harmonic Distortion - Current (THD_i)
    thdv: true             # Total Harmonic Distortion - Voltage (THD_v)

  band_power:              # Broad spectral energy bands
    enabled: true          # Master switch
    i_bp_low: true         # 50–500 Hz
    i_bp_mid: true         # 500–2000 Hz
    i_bp_high: true        # 2000–8000 Hz
    v_bp_low: true         # 50–500 Hz

  spectral_descriptors:
    enabled: true          # Master switch
    i_spec_entropy: true   # Spectral complexity (0-3kHz)

  spectral_envelope:       # Log-Frequency Spectral Shape
    enabled: true          # Master switch
    bands: 8               # Number of log-octave bands (0-8kHz)

  # --- Level 3: Time-Frequency Domain (Transients) ---
  wavelet_domain:
    enabled: true          # Master switch for DWT layer
    levels: 4              # Decomposition depth (0-4)
