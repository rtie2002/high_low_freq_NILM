# E4: E2's separate source models plus E3's training-only ON/OFF balanced risk.
experiment: experiment_mixed_ukdale_refit_5w_house_split.yaml
run: {root: ../runs, name: paper1_e4_specific_event_balanced, seed: 2026, device: auto, deterministic: false}
data: {window_length: 1024, window_stride: 512, power_scale_watts: 4000.0}
model:
  name: appliance_specific_cnn
  hidden_channels: 32
  latent_channels: 2
  output_softplus_beta: 10.0
  output_bias: -0.3
loss: {name: event_balanced_mse}
optimizer: {name: adam, learning_rate: 0.001, weight_decay: 0.00001}
training:
  batch_size: 64
  epochs: 100
  shuffle_train: true
  num_workers: 0
  gradient_clip_norm: 1.0
  early_stopping_patience: 15
  min_epochs: 30
checkpoint: {monitor: validation_mse, mode: min, filename: best.pt}
