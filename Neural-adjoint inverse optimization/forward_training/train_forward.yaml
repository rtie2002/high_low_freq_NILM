# Stage 1 of the Paper 1 inverse model. This is deliberately separate from
# NA-0, which uses only the exact physical sum and needs no learned model.
# Every value read by step1_train_forward_model.py is declared below.
# Paths are resolved relative to this YAML file.

experiment: experiment_mixed_ukdale_refit_5w_house_split.yaml

run:
  root: ../runs
  name: forward_cnn
  seed: 2026
  device: auto                 # auto selects CUDA when available, otherwise CPU.
  deterministic: false         # true trades speed for more repeatable CUDA kernels.

data:
  # The five channels and their order come only from the experiment YAML:
  # kettle, fridge, dishwasher, washingmachine, microwave.
  window_length: 1024          # rows from the preprocessed CSV.
  window_stride: 512           # rows, applied inside each CSV sequence.
  power_scale_watts: 4000.0    # one shared physical scale for all five targets.
  # No residual/background input. No ON/OFF label input. No per-appliance z-score.

model:
  name: appliance_conditioned_cnn  # ApplianceConditionedCNN in forward_model/cnn.py.
  hidden_channels: 32          # channels in both intermediate 1D CNN layers.
  latent_channels: 2           # code channels per appliance after 8x temporal downsampling.
  output_softplus_beta: 10.0   # positive decoder output p = softplus(a; beta).
  output_bias: -0.3            # initial decoder bias in scaled-power units.
  # Fixed architecture in forward_model/cnn.py:
  # 3 x Conv1d(k=4, stride=2) -> 8x downsample -> 3 x ConvTranspose1d(k=4, stride=2).
  # GELU is fixed. Appliance identity is a fixed one-hot decoder condition.

loss:
  name: mse                    # mean over batch, five appliances, and time.

optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.00001

training:
  batch_size: 64
  epochs: 100
  shuffle_train: true
  num_workers: 0
  gradient_clip_norm: 1.0      # null disables clipping.
  early_stopping_patience: 15
  min_epochs: 30

checkpoint:
  monitor: validation_mse
  mode: min
  filename: best.pt
