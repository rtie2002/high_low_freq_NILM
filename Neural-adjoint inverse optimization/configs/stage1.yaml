# Stage-1 training configuration. Model layers live in model.yaml.
# Paths are relative to this file. CLI flags override inference settings.

run:
  root: ../runs
  name: forward_cnn
  seed: 2026
  device: auto                 # auto selects CUDA when available, otherwise CPU.
  deterministic: false         # true trades speed for more repeatable CUDA kernels.

data:
  # The five channels and their order come from dataset.csv.appliances:
  # kettle, fridge, dishwasher, washingmachine, microwave.
  window_length: 1024          # rows from the preprocessed CSV.
  window_stride: 512           # rows, applied inside each CSV sequence.
  power_scale_watts: 4000.0    # one shared physical scale for all five targets.
  # No residual/background input. No ON/OFF label input. No per-appliance z-score.

model_config: model.yaml

loss:
  # mse | event_balanced_mse | inverse_aware_mse
  name: mse

optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.00001

training:
  batch_size: 64
  epochs: 100
  shuffle_train: true
  num_workers: 0
  gradient_clip_norm: 1.0      # null disables clipping.
  early_stopping_patience: 15
  min_epochs: 30

checkpoint:
  monitor: validation_mse
  mode: min
  filename: best.pt

# Used only when loss.name = inverse_aware_mse (use batch_size=16 for this mode).
inverse_aware:
  center_windows: 128
  unroll_steps: 3
  step_size: 0.50
  gradient_normalization: rms
  gradient_norm_epsilon: 1.0e-8
  weight: 0.10
  loss: event_balanced_mse

evaluation:
  batch_size: 64
  on_periods: 5
  long_samples: 4096
  dpi: 300

# CSV paths, normalization and fixed evaluation protocol.
dataset:
  # Mixed UK-DALE + REFIT house-held-out protocol.
  #
  # Training: best active contiguous 5-week sub-blocks inside the established
  # 8-week intervals, so the duration ablation does not change calendar periods
  #   UK-DALE 1; REFIT 3, 5, 9, 11
  # Validation: complete held-out 8-week blocks
  #   UK-DALE 5; REFIT 2
  # Test: same houses and 8-week calendar bounds as the established protocol,
  # re-extracted from the current corrected original CSVs
  #   UK-DALE 2; REFIT 20
  dataset_id: mixed_ukdale_refit_5w_house_split
  seed: 2026
  data_root: ../dataset/mixed_ukdale_refit_5w_house_split
  
  csv:
    sample_seconds: 8
    train_file: training/multi_appliance_training.csv
    validation_file: validating/multi_appliance_validating.csv
    test_file: testing/multi_appliance_testing.csv
    test_scenarios:
      refit_house20: testing/refit_house20/multi_appliance_testing.csv
      ukdale_house2: testing/ukdale_house2/multi_appliance_testing.csv
    mains_column: aggregate
    appliances:
      kettle:         {power: kettle_power,         state: kettle_on}
      fridge:         {power: fridge_power,         state: fridge_on}
      dishwasher:     {power: dishwasher_power,     state: dishwasher_on}
      washingmachine: {power: washingmachine_power, state: washingmachine_on}
      microwave:      {power: microwave_power,      state: microwave_on}
  
  # Fitted only on the five training houses. Validation/test houses never
  # contribute to normalization statistics.
  normalization_file: ../dataset/mixed_ukdale_refit_5w_house_split/normalization_stats.json
  
  evaluation:
    on_thresholds_watts:
      kettle: 40
      fridge: 50
      dishwasher: 30
      washingmachine: 30
      microwave: 100
    max_on_power_watts:
      kettle: 4000
      # Training-only ON-power q99.9 is 512 W. Keep startup transients while
      # preventing impossible kettle-sized fridge predictions.
      fridge: 600
      dishwasher: 4000
      washingmachine: 3999
      microwave: 4000
    power_postprocess:
      enabled: true
      min_power_watts: 5
    sae_period: 1200
    # Report event-onset F1 with the known two-sample REFIT timing uncertainty.
    # Strict pointwise F1 remains unchanged and is still reported separately.
    event_tolerance_seconds: 16
    power_unit: watts
