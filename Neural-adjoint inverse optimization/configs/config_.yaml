# NA-0 physical inverse baseline.  Paths are resolved relative to this file.
# This project owns the experiment YAML and all Python protocol code.  The
# original CSV dataset stays shared to avoid duplicating multi-gigabyte assets.

experiment: experiment_mixed_ukdale_refit_5w_house_split.yaml
run_root: runs
seed: 2026

window:
  # At 8 s/sample this is about 34 min.  Start small for an inverse-method
  # smoke test; use the same window/stride for every NA-0 ablation.
  length: 256
  stride: 128
  batch_size: 8

inverse:
  # Optimisation occurs in scaled watts, so this sets the numerical scale only.
  power_scale_watts: 4000.0
  steps: 150
  learning_rate: 0.08

  # Feasible ranges are a transparent NA-0 constraint, not learned priors.
  # Keep the device order from this project's experiment YAML.
  appliance_max_watts:
    kettle: 4000
    fridge: 600
    dishwasher: 4000
    washingmachine: 3999
    microwave: 4000
  background_max_watts: 8000

  # Set to zero in NA-0.  Later ablations may activate a clearly named,
  # separately reported temporal regulariser.
  lambda_total_variation: 0.0

evaluation:
  waveform_periods: 5
  waveform_dpi: 200
