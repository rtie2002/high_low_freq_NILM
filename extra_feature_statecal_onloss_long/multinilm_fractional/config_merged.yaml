experiment:
  dataset_id: mixed_ukdale_refit_3w
  seed: 2026
  data_root: datasets/mixed_ukdale_refit_3w
  csv:
    train_file: training/multi_appliance_training.csv
    validation_file: validating/multi_appliance_validating.csv
    test_file: testing/multi_appliance_testing.csv
    mains_column: aggregate
    appliances:
      kettle:
        power: kettle_power
        state: kettle_on
      fridge:
        power: fridge_power
        state: fridge_on
      dishwasher:
        power: dishwasher_power
        state: dishwasher_on
      washingmachine:
        power: washingmachine_power
        state: washingmachine_on
      microwave:
        power: microwave_power
        state: microwave_on
  normalization:
    aggregate:
      mean: 775
      std: 1045
    appliances:
      kettle:
        mean: 20
        std: 214
      fridge:
        mean: 39
        std: 68
      dishwasher:
        mean: 44
        std: 297
      washingmachine:
        mean: 27
        std: 190
      microwave:
        mean: 14
        std: 99
  evaluation: &id001
    on_thresholds_watts:
      kettle: 40
      fridge: 50
      dishwasher: 30
      washingmachine: 30
      microwave: 100
    max_on_power_watts:
      kettle: 4000
      fridge: 4000
      dishwasher: 4000
      washingmachine: 3999
      microwave: 4000
    power_postprocess:
      enabled: true
      min_power_watts: 5
    sae_period: 1200
    power_unit: watts
  experiment_id: extra_feature_statecal_onloss_long
model:
  experiment_id: extra_feature_statecal_onloss_long
  model_name: multinilm_fractional
  data:
    mains_column: aggregate
    state_label_source: csv
  evaluation:
    pred_on_source: state_head
    regate_power_with_pred_on: true
    state_calibration:
      enabled: true
      split: validation
      threshold_grid:
      - 0.05
      - 0.98
      - 0.01
      apply_to_power: true
      postprocess:
        enabled: true
        min_on_samples:
          kettle: 5
          fridge: 20
          dishwasher: 160
          washingmachine: 300
          microwave: 10
        merge_gap_samples:
          kettle: 0
          fridge: 40
          dishwasher: 300
          washingmachine: 160
          microwave: 3
  windowing:
    input_window_length: 2048
    output_window_length: 2048
    output_alignment: end
    input_stride: 1024
    eval_stride: 1024
    eval_reconstruction: auto
    training_targets: auto
  fractional:
    enabled: true
    k: 4
    include_raw: true
    include_delta: false
    include_abs_delta: true
    include_rolling_mean: true
    include_rolling_std: true
    rolling_windows:
    - 10
    - 30
    - 60
    memory: 32
    channel_normalize: none
  architecture:
    channel_schedule:
    - 32
    - 64
    - 128
    hidden_channels: 128
    use_multiscale_stem: true
    detail_kernels:
    - 3
    - 5
    - 9
    detail_branch_channels: 16
    stem_kernel_size: 7
    stage_kernel_size: 5
    num_blocks: 4
    kernel_size: 9
    max_dilation: 16
    dropout: 0.25
    head_local_layers: 2
    head_kernel_size: 3
    head_use_residual: true
    gate_mode: soft
    gate_threshold: 0.5
    cross_appliance:
      enabled: false
      residual_scale: 0.5
    domain_feature_layers:
    - temporal_1
    - temporal_3
    - aligned
  loss:
    task_balance: equal
    lambda_state: 1
    pos_weight: auto
    pos_weight_cap: 30
    power_on_weight: 2.0
    power_delta_weight: 0.25
    power_delta_on_only: true
    power_energy_weight: 0.1
    domain_method: both
    domain_mu: 0.4
    domain_mix: convex
    domain_scale: equal
    lambda_domain: 0.0
    da_warmup_epochs: 0
    da_ramp_epochs: 0
    da_freeze_patience: 0
  domain_adaptation:
    enabled: false
    target_split: test
  training:
    batch_size: 64
    epochs: 160
    learning_rate: 0.0001
    weight_decay: 0.0001
    num_workers: 0
    train_shuffle: true
    gradient_clip: 1.0
    use_amp: false
    amp_dtype: bf16
    cudnn_benchmark: true
    tf32: true
    checkpoint_monitor: val_mae_minus_f1
    checkpoint_mae_space: normalized
    checkpoint_mae_weight: 7.0
    early_stop_patience: 45
    early_stop_min_epochs: 80
    scheduler: reduce_on_plateau
    lr_scheduler:
      type: reduce_on_plateau
      monitor: val_mae_minus_f1
      patience: 10
      factor: 0.5
      min_lr: 1.0e-05
    plots:
      plot_mode: interval
      plot_interval: 50
      plot_on_periods: 5
      plot_max_batches: 16
      waveform_figsize: 5.5
      waveform_dpi: 300
      waveform_dynamic_figsize: true
      on_period_margin_min: 40
      on_period_margin_frac: 0.08
      waveform_context_scale: 10
      comparison_dpi: 600
      feature_maps:
        enabled: false
        max_examples: 2
        cmap: magma
        display_activation: relu
        min_on_duration: 10
        dpi: 200
model_name: multinilm_fractional
experiment_id: extra_feature_statecal_onloss_long
appliances:
- kettle
- fridge
- dishwasher
- washingmachine
- microwave
data_root: datasets/mixed_ukdale_refit_3w
evaluation: *id001
seed: 2026
