 <rect x="238" y="607" width="144" height="42" class="private"/><text x="310" y="634">Decoder M</text><text x="210" y="634">…</text>
 <path d="M110 649V662H73V674" class="line"/><path d="M110 662H145V674" class="line"/><path d="M310 649V662H273V674" class="line"/><path d="M310 662H345V674" class="line"/>
 <rect x="38" y="674" width="70" height="38" class="power"/><rect x="108" y="674" width="74" height="38" class="state"/>
 <text x="73" y="699" class="math">ŷ₁</text><text x="145" y="699" class="math">ŝ₁</text>
 <rect x="238" y="674" width="70" height="38" class="power"/><rect x="308" y="674" width="74" height="38" class="state"/>
 <text x="273" y="699" class="math">ŷₘ</text><text x="345" y="699" class="math">ŝₘ</text>
 <text x="210" y="739" class="small">Shared features; separate appliance decoding</text>
</g>
<g transform="translate(840,0)">
 <text x="210" y="438" class="title">(f) Interaction among private streams</text>
 <rect x="70" y="462" width="280" height="37" class="box"/><text x="210" y="487">Aggregate input x</text>
 <path d="M210 499V519" class="line"/>
 <rect x="70" y="519" width="280" height="38" class="box"/><text x="210" y="544">Shared encoder</text>
 <path d="M210 557V568H110V580" class="line"/><path d="M210 568H310V580" class="line"/>
 <rect x="38" y="580" width="144" height="37" class="private"/><text x="110" y="605">Decoder 1</text>
 <rect x="238" y="580" width="144" height="37" class="private"/><text x="310" y="605">Decoder M</text><text x="210" y="605">…</text>
 <path d="M110 617V633" class="line"/><path d="M310 617V633" class="line"/>
 <rect x="38" y="633" width="344" height="27" class="relation"/><text x="210" y="653" class="small">Cross-appliance feature interaction</text>
 <path d="M110 660V667H73V674" class="line"/><path d="M110 667H145V674" class="line"/><path d="M310 660V667H273V674" class="line"/><path d="M310 667H345V674" class="line"/>
 <rect x="38" y="674" width="70" height="38" class="power"/><rect x="108" y="674" width="74" height="38" class="state"/>
 <text x="73" y="699" class="math">ŷ₁</text><text x="145" y="699" class="math">ŝ₁</text>
 <rect x="238" y="674" width="70" height="38" class="power"/><rect x="308" y="674" width="74" height="38" class="state"/>
 <text x="273" y="699" class="math">ŷₘ</text><text x="345" y="699" class="math">ŝₘ</text>
 <text x="210" y="739" class="small">MART-NILM follows this sharing pattern</text>
</g>
<path d="M30 770H76" class="line"/><text x="164" y="776" class="small">Learned prediction</text>
<path d="M310 770H356" class="derived"/><text x="469" y="776" class="small">Derived output (optional)</text>
