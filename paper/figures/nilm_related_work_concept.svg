<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="790" viewBox="0 0 1260 790">
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#394550"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#27333d;text-anchor:middle;font-size:18px}
 .heading{font-size:21px;font-weight:700}.title{font-size:19px;font-weight:700}.small{font-size:15px}.math{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-style:italic}
 .box{stroke:#63727e;stroke-width:1.4;fill:#e9edf0}.power{fill:#dceaf2;stroke:#527b93;stroke-width:1.4}.state{fill:#f4e6d5;stroke:#aa7c43;stroke-width:1.4}.private{fill:#e3ece4;stroke:#63846a;stroke-width:1.4}.relation{fill:#e9e3ef;stroke:#847098;stroke-width:1.4}
 .line{fill:none;stroke:#394550;stroke-width:1.5;marker-end:url(#arrow)}.derived{fill:none;stroke:#78818a;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#arrow)}.bus{fill:none;stroke:#394550;stroke-width:1.5}.divider{stroke:#d7dde2;stroke-width:1}
 </style>
</defs>
<rect width="1260" height="790" fill="white"/>
<text x="630" y="28" class="heading">Prediction objectives</text>
<path d="M420 51V331M840 51V331" class="divider"/>
<g transform="translate(0,0)">
 <text x="210" y="64" class="title">(a) Power regression</text>
 <rect x="80" y="96" width="260" height="42" class="box"/><text x="210" y="123">Aggregate input x</text>
 <path d="M210 138V160" class="line"/>
 <rect x="80" y="160" width="260" height="46" class="box"/><text x="210" y="189">Multi-target regressor</text>
 <path d="M210 206V228" class="line"/>
 <rect x="80" y="228" width="260" height="42" class="power"/><text x="210" y="255" class="math">ŷ₁, …, ŷₘ</text>
 <path d="M210 270V292" class="derived"/>
 <text x="210" y="315" class="small">Optional: power threshold → states</text>
</g>
<g transform="translate(420,0)">
 <text x="210" y="64" class="title">(b) State classification</text>
 <rect x="80" y="96" width="260" height="42" class="box"/><text x="210" y="123">Aggregate input / features</text>
 <path d="M210 138V160" class="line"/>
 <rect x="80" y="160" width="260" height="46" class="box"/><text x="210" y="189">Multi-label classifier</text>
 <path d="M210 206V228" class="line"/>
 <rect x="80" y="228" width="260" height="42" class="state"/><text x="210" y="255" class="math">ẑ₁, …, ẑₘ</text>
 <path d="M210 270V292" class="derived"/>
 <text x="210" y="315" class="small">Optional: state power lookup → power</text>
</g>
<g transform="translate(840,0)">
 <text x="210" y="64" class="title">(c) Joint power and state learning</text>
 <rect x="80" y="96" width="260" height="42" class="box"/><text x="210" y="123">Aggregate input x</text>
 <path d="M210 138V160" class="line"/>
 <rect x="80" y="160" width="260" height="46" class="box"/><text x="210" y="189">Joint representation</text>
 <path d="M210 206V216H115V228" class="line"/><path d="M210 216H305V228" class="line"/>
 <rect x="35" y="228" width="160" height="42" class="power"/><text x="115" y="255" class="math">ŷ₁, …, ŷₘ</text>
 <rect x="225" y="228" width="160" height="42" class="state"/><text x="305" y="255" class="math">ŝ₁, …, ŝₘ</text>
 <text x="210" y="309" class="small">Paired supervision for each appliance</text>
</g>
<path d="M20 343H1240" class="divider"/>
<text x="630" y="375" class="heading">Representation sharing across appliances</text>
<text x="630" y="400" class="small">Joint outputs are shown below to hold the prediction objectives fixed.</text>
<path d="M420 423V748M840 423V748" class="divider"/>
<g>
 <text x="210" y="438" class="title">(d) Independent appliance models</text>
 <rect x="70" y="462" width="280" height="37" class="box"/><text x="210" y="487">Aggregate input x</text>
