# redd.yaml — multi-appliance REDD preprocessing (UK-DALE-aligned)
#
# Input (either):
#   A) NILMTK HDF5: dataset_preprocess/REDD/redd.h5
#   B) Raw low_freq:  <data_dir>/house_N/channel_*.dat
#
# Output schema matches ukdale_processing_multi_appliance.py:
#   readable_time, house, aggregate, <app>_power, <app>_on

paths:
  data_dir: "dataset_preprocess/REDD"
  # If set (relative to data_dir or absolute), prefer HDF5 over channel_*.dat
  h5_file: "redd.h5"
  save_path: "dataset_preprocess/created_data/REDD"
  naming:
    train: "{appliance}_training.csv"
    val: "{appliance}_validation.csv"
    test: "{appliance}_test.csv"

global_params:
  timezone: "US/Eastern"
  # null = use full overlapping range (same idea as UK-DALE --full_range)
  start_date: null
  end_date: null
  # Align to UK-DALE 6 s grid for cross-dataset transfer
  sample_seconds: 6
  aggregate_mean: 522
  aggregate_std: 814
  # For this multi-appliance (fridge, dishwasher, microwave, washingmachine) setup,
  # we only sample houses 1 and 3 (the houses with usable activity across all 4).
  houses: [1, 3]
  appliances_to_process: ["microwave", "fridge", "dishwasher", "washingmachine"]

# Channel / meter ids match REDD low_freq channel_N.dat and NILMTK meterN.
# Lists mean sum of meters (e.g. house-1 washer dryer is dual-phase 10+20).
appliances:
  fridge:
    mean: 157
    std: 157
    max_power: 2848
    on_power_threshold: 50
    min_off_duration: 2
    min_on_duration: 10
    resample_gap_fill: 3
    houses: [1, 3]
    channel_map: {1: 5, 3: 7}

  dishwasher:
    mean: 700
    std: 1000
    max_power: 3964
    on_power_threshold: 10
    min_off_duration: 300
    min_on_duration: 300
    resample_gap_fill: 3
    houses: [1, 3]
    channel_map: {1: 6, 3: 9}

  microwave:
    mean: 500
    std: 800
    max_power: 3969
    on_power_threshold: 200
    min_off_duration: 5
    min_on_duration: 2
    resample_gap_fill: 3
    houses: [1, 3]
    channel_map: {1: 11, 3: 16}

  washingmachine:
    mean: 400
    std: 700
    max_power: 3999
    on_power_threshold: 20
    min_off_duration: 100
    # 300 (=30 min @ 6s) matches Kelly/UK-DALE but drops real REDD H1 cycles ~20-25 min.
    # 150 (=15 min) keeps those activations; H1 events 7→16 in a quick sweep.
    min_on_duration: 150
    resample_gap_fill: 3
    houses: [1, 3]
    # H1 washer dryer is split across two 120 V legs in NILMTK/REDD
    channel_map: {1: [10, 20], 3: 13}

# Same Algorithm-1 knobs as UK-DALE (shared apply_algorithm1_labeling)
algorithm1:
  window_length: 0
  x_noise: 0
  remove_spikes: true
  spike_window: 5
  spike_threshold: 3.0
  background_threshold: 50
  resample_gap_fill: 3
